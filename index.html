  const fillMeta=()=>{Object.keys(S.meta).forEach(k=>{$("#m-"+k).value=S.meta[k]||""});$("#nNote").value=S.note||"";const f=NILAI[S.cat];$("#nSkop").innerHTML=`<b>Kategori:</b> ${esc(f.cat)}<br><span class="muted"><b>Skop:</b> ${esc(f.skop)}</span>`};
  const drawSum=()=>{const s=nilaiScore(S);const gc={A:"var(--ok)",B:"var(--brand)",C:"var(--warn)",F:"var(--k)"}[s.grade]||"var(--muted)";
    $("#nSum").innerHTML=`<span class="eyebrow">Gred keseluruhan</span><div class="row" style="align-items:baseline;gap:14px"><span style="font-family:var(--f-display);font-size:2.8rem;line-height:1;color:${gc}">${s.grade}</span><span class="num" style="font-size:1.3rem">${s.pct==null?"":s.pct+"%"}</span></div>
    <span class="muted" style="font-size:.8rem">${s.n} daripada ${s.all} tindakan dinilai · A ${s.cnt.A} · B ${s.cnt.B} · C ${s.cnt.C} · F ${s.cnt.F}</span>
    <div class="vbars">${Object.keys(VCOL).map(k=>{const p=s.per[k];const val=p&&p.n?Math.round(p.t/p.n):null;return `<div class="r" style="--vc:${VCOL[k]}"><span>${k}</span><span class="tr"><i style="width:${val||0}%"></i></span><b class="num" style="text-align:right;font-size:.78rem">${val==null?"—":val+"%"}</b></div>`}).join("")}</div>
    <p class="muted" style="font-size:.75rem">Kaedah markah (cadangan): A=100, B=80, C=40, F=0, purata tindakan yang dinilai. Gred: A ≥90%, B ≥70%, C ≥40%, F &lt;40%.</p>`};
  const drawList=()=>{const f=NILAI[S.cat];$("#nList").innerHTML=f.s.map((sec,si)=>`<section class="stack" style="gap:8px"><div class="sub" style="margin-top:4px">${"ABCDEF"[si]}. ${esc(sec.t)}</div>${sec.i.map(it=>`<div class="nrow" style="--vc:${VCOL[it[1]]}" data-n="${it[0]}"><span class="no">${it[0]}</span><div style="min-width:0"><span class="vtag" style="--vc:${VCOL[it[1]]};margin-bottom:4px">${it[1]}</span><div>${esc(it[2])}</div>${it[3]?`<span class="ay">${esc(it[3])}</span>`:""}</div><span class="seg gseg" role="group" aria-label="Gred">${["A","B","C","F"].map(g=>`<button data-v="${g}" aria-pressed="${S.g[it[0]]===g}">${g}</button>`).join("")}</span></div>`).join("")}</section>`).join("");drawSum()};
  const drawHist=()=>{const H=store.get("sccp-nilai-hist",[]);$("#nHist").innerHTML=H.length?H.map((h,i)=>`<div class="h"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(h.meta.nama||"(tiada nama)")}</b><br><span class="muted" style="font-size:.76rem">QLT 07-${h.cat} · ${esc((h.meta.masa||h.at||"").slice(0,10))}</span></span><b>${h.grade}${h.pct!=null?` <span class="muted num" style="font-weight:400">${h.pct}%</span>`:""}</b><span class="row" style="gap:4px"><button class="btn sm" data-load="${i}">Buka</button><button class="btn sm" data-del="${i}" aria-label="Padam">×</button></span></div>`).join(""):`<p class="muted" style="font-size:.82rem">Belum ada penilaian disimpan.</p>`};
  $$("[data-cat]",v).forEach(b=>b.onclick=()=>{if(S.cat===b.dataset.cat)return;S.cat=b.dataset.cat;S.g={};save();$$("[data-cat]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));fillMeta();drawList()});
  Object.keys(S.meta).forEach(k=>$("#m-"+k).oninput=e=>{S.meta[k]=e.target.value;save()});
  $("#nNote").oninput=e=>{S.note=e.target.value;save()};
  $("#nList").addEventListener("click",e=>{const b=e.target.closest(".gseg button");if(!b)return;const r=b.closest(".nrow");const n=r.dataset.n;S.g[n]=S.g[n]===b.dataset.v?undefined:b.dataset.v;if(!S.g[n])delete S.g[n];save();$$("button",r).forEach(x=>x.setAttribute("aria-pressed",S.g[n]===x.dataset.v));drawSum()});
  const summaryText=()=>{const s=nilaiScore(S);const f=NILAI[S.cat];const L=["PENILAIAN PENGAMALAN NILAI-NILAI TERAS PUSRAWI — QLT 07-"+S.cat,"Kategori : "+f.cat,"Nama     : "+(S.meta.nama||"-"),"Jawatan  : "+(S.meta.jaw||"-"),"Jabatan  : "+(S.meta.jab||"-"),"Tarikh   : "+((S.meta.masa||"-").replace("T"," ")),"Tugasan  : "+(S.meta.tugas||"-"),"Penilai  : "+(S.meta.oleh||"-"),"",`GRED KESELURUHAN: ${s.grade}${s.pct!=null?" ("+s.pct+"%)":""} | A ${s.cnt.A} · B ${s.cnt.B} · C ${s.cnt.C} · F ${s.cnt.F} | ${s.n}/${s.all} dinilai`,"","Profil nilai:"];
    Object.keys(VCOL).forEach(k=>{const p=s.per[k];L.push(`- ${k} (${VAR[k]}): ${p&&p.n?Math.round(p.t/p.n)+"%":"-"}`)});
    const low=f.s.flatMap(x=>x.i).filter(it=>S.g[it[0]]==="C"||S.g[it[0]]==="F");if(low.length){L.push("","Perlu penambahbaikan:");low.forEach(it=>L.push(`${it[0]}. [${S.g[it[0]]}] ${it[1]} — ${it[2]}`))}
    if(S.note){L.push("","Catatan penilai: "+S.note)}return L.join("\n")};
  $("#nCopy").onclick=()=>copyText(summaryText(),$("#nCopy"));
  $("#nSave").onclick=()=>{const s=nilaiScore(S);if(!s.n&&!S.meta.nama){toast("Isi nama atau beri sekurang-kurangnya satu gred dahulu");return}const H=store.get("sccp-nilai-hist",[]);H.unshift(Object.assign(JSON.parse(JSON.stringify(S)),{pct:s.pct,grade:s.grade,at:new Date().toISOString()}));store.set("sccp-nilai-hist",H.slice(0,100));S=blank(S.cat);save();fillMeta();drawList();drawHist();toast("Disimpan ke sejarah")};
  $("#nReset").onclick=()=>{$("#nConf").hidden=false;$("#nConf").scrollIntoView({block:"nearest"})};$("#nNo").onclick=()=>$("#nConf").hidden=true;$("#nYes").onclick=()=>{S=blank(S.cat);save();fillMeta();drawList();$("#nConf").hidden=true;toast("Borang dikosongkan")};
  $("#nHist").addEventListener("click",e=>{const H=store.get("sccp-nilai-hist",[]);const l=e.target.closest("[data-load]"),d=e.target.closest("[data-del]");
    if(l){const h=H[+l.dataset.load];S={cat:h.cat,meta:h.meta,g:h.g,note:h.note||""};save();$$("[data-cat]",v).forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat===S.cat));fillMeta();drawList();window.scrollTo(0,0);toast("Penilaian dibuka")}
    if(d){H.splice(+d.dataset.del,1);store.set("sccp-nilai-hist",H);drawHist()}});
  fillMeta();drawList();drawHist();
}

/* ================= EXPORT PDF / WORD ================= */
const EXPORTABLE={gsheet:"Panduan Dashboard Google Sheet",latihan:"Modul Latihan SCCP",kuiz:"Kuiz Penilaian Kefahaman SCCP",pustaka:"Pustaka SCCP",jabatan:"SCCP Mengikut Jabatan",pantas:"Rujukan Pantas Hukum",borang:"Indeks Borang dan Polisi",glosari:"Glosari Istilah",nilai:"Penilaian Pengamalan Nilai Teras",umum:"Senarai Semak Syariah Umum",audit:"Laporan Audit SCCP",susulan:"Tindakan Susulan SCCP"};
let DL=null,DLtried=false;
/* Di claude.ai: guna keupayaan "downloads". Di laman web biasa (cth. GitHub Pages): muat turun terus melalui pelayar. */
const WEB_DL={save:async({filename,data})=>{const MT={pdf:"application/pdf",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",csv:"text/csv;charset=utf-8"};
  const ext=filename.split(".").pop();const blob=data instanceof Blob?data:new Blob([data],{type:MT[ext]||"application/octet-stream"});
  const url=URL.createObjectURL(blob);const el=document.createElement("a");el.href=url;el.download=filename;el.rel="noopener";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};
async function getDL(){if(DLtried)return DL;DLtried=true;
  if(!(window.claude&&window.claude.use)){DL=WEB_DL;return DL}
  try{DL=await window.claude.use("downloads")}catch(e){DL=null}return DL}
function addExportBar(r,v){if(!EXPORTABLE[r])return;
  const bar=document.createElement("div");const side=v.querySelector(".sumbox");
  bar.className=side?"xbar side":"xbar";
  bar.innerHTML=side?`<div class="row" style="gap:8px"><button class="btn" data-x="pdf">⬇ PDF</button><button class="btn" data-x="docx">⬇ Word</button></div><span class="xmsg muted"></span>`:`<span class="muted">Muat turun bahagian ini:</span><button class="btn sm" data-x="pdf">PDF</button><button class="btn sm" data-x="docx">Word (.docx)</button><span class="xmsg muted"></span>`;
  if(side){const pri=side.querySelector(".btn.pri");(pri||side.firstElementChild).after(bar);if(pri&&(r==="audit"||r==="nilai"))pri.addEventListener("click",()=>autoSync(r,bar))}else{const h=v.querySelector("header");if(!h)return;h.appendChild(bar)}
  getDL().then(d=>{if(!d){bar.querySelectorAll("button").forEach(b=>b.disabled=true);bar.querySelector(".xmsg").textContent="Muat turun tidak tersedia dalam paparan ini."}});
  bar.onclick=async e=>{const b=e.target.closest("[data-x]");if(!b)return;const msg=bar.querySelector(".xmsg");
    bar.querySelectorAll("button").forEach(x=>x.disabled=true);msg.textContent="Menyediakan fail…";
    try{const x=b.dataset.x;let fn,data;
      if(x==="gs"||x==="gsall"){msg.textContent="Menghantar ke Google Sheet…";const rows=r==="audit"?auditRowsArr():nilaiRowsArr(x==="gsall");if(!rows.length)throw{message:x==="gsall"?"tiada penilaian dalam sejarah":"tiada data"};
        const j=await gsSend({type:r==="audit"?"audit":"nilai",rows});msg.textContent=j.unverified?"Dihantar ("+rows.length+" baris). Semak Google Sheet untuk pengesahan.":`Berjaya: ${j.ditambah} baris ditambah ke ${j.helaian}${j.diganti?` (${j.diganti} baris lama dengan ID sama dikemas kini)`:""}.`;toast("Dihantar ke Google Sheet");return}
      if(x==="csv"||x==="csvall"){data=r==="audit"?csvAudit():csvNilai(x==="csvall");if(!data.trim())throw{message:x==="csvall"?"tiada penilaian dalam sejarah":"tiada data"};
        fn=(r==="audit"?"GSheet-Data_Audit-":"GSheet-Data_Nilai-")+(x==="csvall"?"sejarah-":"")+today()+".csv"}
      else{const doc=buildPrint(r);fn=doc.file+"."+x;data=x==="pdf"?await toPDF(doc):await toDOCX(doc)}
      const d=await getDL();if(!d)throw{code:"unavailable"};
      await d.save({filename:fn,data});msg.textContent="Fail disediakan: "+fn;if(r==="audit"||r==="nilai")autoSync(r,bar)}
    catch(err){const gsx=/^gs/.test(b.dataset.x);msg.textContent=err&&err.code==="declined"?"Muat turun dibatalkan.":err&&err.code==="rate_limited"?"Tunggu sebentar dan cuba lagi.":(gsx?"Tidak dapat menghantar (":"Tidak dapat menyediakan fail (")+((err&&(err.code||err.message))||"ralat")+")."}
    finally{bar.querySelectorAll("button").forEach(x=>x.disabled=false)}}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej({message:"gagal memuat pustaka"});document.head.appendChild(s)})}
const today=()=>new Date().toISOString().slice(0,10);

function toModel(html){
  const root=document.createElement("div");root.innerHTML=html;const out=[];
  const clean=s=>s.replace(/\s+/g," ");
  const segs=n=>{const res=[];const rec=(x,b,i)=>{x.childNodes.forEach(c=>{if(c.nodeType===3){if(c.textContent)res.push({t:c.textContent,b,i})}else if(c.nodeType===1){const tg=c.tagName;if(tg==="BR"){res.push({t:"\n",b,i});return}if(c.classList&&c.classList.contains("mk"))return;rec(c,b||tg==="B"||tg==="STRONG"||tg==="TH",i||tg==="I"||tg==="EM")}})};rec(n,false,false);
    const m=[];res.forEach(s=>{const t=s.t==="\n"?"\n":clean(s.t);const l=m[m.length-1];if(l&&l.b===s.b&&l.i===s.i&&t!=="\n"&&l.t!=="\n")l.t+=t;else m.push({t,b:s.b,i:s.i})});
    if(m.length){m[0].t=m[0].t.replace(/^\s+/,"");const z=m[m.length-1];z.t=z.t.replace(/\s+$/,"")}return m.filter(s=>s.t!=="")};
  const plain=n=>segs(n).map(s=>s.t).join("").trim();
  const walk=n=>{for(const c of n.children){const tg=c.tagName;
    if(tg==="STYLE"||tg==="SCRIPT")continue;
    if(/^H[1-4]$/.test(tg)){out.push({k:"h",lv:+tg[1],t:plain(c)});continue}
    if(tg==="TABLE"){const rows=[...c.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>({t:plain(td),th:td.tagName==="TH",c:td.className})));out.push({k:"table",rows,cls:c.className});continue}
    if(tg==="OL"||tg==="UL"){[...c.children].forEach((li,i)=>{if(li.tagName!=="LI")return;let pre=tg==="UL"?"•":c.getAttribute("type")==="A"?String.fromCharCode(65+i)+".":c.classList.contains("rom")?(ROMAN[i]||i+1)+".":(i+1)+".";
      const s=segs(li);if(li.firstElementChild&&li.firstElementChild.tagName==="I"&&/^\d+$/.test(li.firstElementChild.textContent.trim())){pre=li.firstElementChild.textContent.trim()+".";s.shift()}
      out.push({k:"li",pre,s})});continue}
    if(c.classList.contains("ar")){out.push({k:"ar",t:plain(c)});continue}
    const blockKids=[...c.children].some(k=>/^(DIV|P|H[1-4]|TABLE|OL|UL|SECTION|ARTICLE|HEADER|ASIDE|DETAILS)$/.test(k.tagName));
    if(blockKids){if(c.classList.contains("pv-item"))out.push({k:"rule"});walk(c)}else{const s=segs(c);if(s.length)out.push({k:"p",s,org:c.classList.contains("pv-org"),sub:c.classList.contains("pv-sub")})}}};
  walk(root);return out}

const GSCODE="/**\n * SCCP PUSRAWI \u2014 Penerima data dari portal One Stop Center (versi 2: Audit, Nilai Teras & Kuiz)\n * Tampal kod ini dalam: Extensions (Sambungan) \u2192 Apps Script \u2192 Code.gs\n * Selepas tampal: Deploy \u2192 Manage deployments \u2192 \u270f Edit \u2192 Version: New version \u2192 Deploy (URL kekal sama)\n */\nconst HELAIAN = { audit: 'Data_Audit', nilai: 'Data_Nilai', kuiz: 'Data_Kuiz' };\n\n/** Soalan Kuiz Penilaian Kefahaman SCCP (ikut turutan dalam portal) */\nconst SOALAN = [\n  \"Apakah maksud isu SCCP bertahap Kritikal (K)?\",\n  \"Piawaian SIRIM yang menjadi asas SCCP Hospital PUSRAWI ialah\u2026\",\n  \"Apabila maqasid bertembung, urutan keutamaan asas ialah\u2026\",\n  \"Etika 3S bagi perawat dan pesakit berlainan jantina ialah\u2026\",\n  \"Jika tiada peneman atau chaperon semasa rawatan di bilik tertutup, apa yang perlu dilakukan?\",\n  \"Borang yang digunakan untuk keizinan pesakit menggunakan ubat berunsur tidak halal ialah\u2026\",\n  \"Isu syariah yang timbul dalam operasi jabatan dirujuk melalui\u2026\",\n  \"Barang tidak dituntut (luqatah) disimpan berapa lama sebelum diserahkan kepada Baitulmal MAIWP?\",\n  \"Menurut Garis Panduan JAKIM (2013), penggunaan inhaler semasa berpuasa\u2026\",\n  \"Penamatan rawatan sokongan hayat bagi mati otak mesti disahkan oleh\u2026\",\n  \"Jenazah transgender diuruskan mengikut\u2026\",\n  \"Jika keluarga tidak mampu menanam uri (tembuni), hukumnya\u2026\",\n  \"Kontrak sewa beli patuh syariah yang digunakan untuk mesin MRI dan Digital X-ray ialah\u2026\",\n  \"Keutamaan pertama perawat bagi pesakit wanita menurut Majma' al-Fiqh al-Islami (1993) ialah\u2026\",\n  \"Kaedah 'al-dharurah tuqaddar bi qadariha' paling tepat diaplikasikan pada\u2026\",\n  \"Ubat-ubatan dan pewangi yang mengandungi alkohol, menurut Muzakarah Kali Ke-7 (1984), hukumnya\u2026\",\n  \"Huruf 'W' dalam nilai teras PUSRAWI mewakili\u2026\",\n  \"Anggota badan pembedahan yang boleh berjangkit diuruskan secara\u2026\"\n];\n\nconst KUIZ_LAJUR = ['ID_Kuiz', 'Tarikh', 'Masa', 'Tahun', 'Bulan', 'Nama', 'No_Staf', 'Jabatan', 'Jawatan',\n  'Markah', 'Jumlah_Soalan', 'Peratus', 'Keputusan', 'Cubaan_Ke', 'Soalan_Salah']\n  .concat(SOALAN.map((_, i) => 'S' + (i + 1)));\nconst LEBAR = { audit: 16, nilai: 53, kuiz: KUIZ_LAJUR.length };   // bilangan lajur setiap tab\nconst WARNA = '#11604F';\n\n/** Menu dalam Google Sheet */\nfunction onOpen() {\n  SpreadsheetApp.getUi().createMenu('SCCP PUSRAWI')\n    .addItem('1. Tetapkan token keselamatan', 'tetapkanToken')\n    .addItem('2. Lihat token semasa', 'lihatToken')\n    .addSeparator()\n    .addItem('3. Sediakan tab Kuiz & Dashboard_Kuiz', 'sediakanKuiz')\n    .addItem('Semak struktur helaian', 'semakStruktur')\n    .addToUi();\n}\n\nfunction tetapkanToken() {\n  const ui = SpreadsheetApp.getUi();\n  const r = ui.prompt('Token keselamatan',\n    'Masukkan kata kunci rahsia (cth. PUSRAWI-SCCP-2026). Kata kunci yang sama perlu diisi dalam portal \u2192 Sambung Google Sheet \u2192 Bahagian C.',\n    ui.ButtonSet.OK_CANCEL);\n  if (r.getSelectedButton() !== ui.Button.OK) return;\n  const t = r.getResponseText().trim();\n  if (t.length < 6) { ui.alert('Token terlalu pendek (sekurang-kurangnya 6 aksara).'); return; }\n  PropertiesService.getScriptProperties().setProperty('TOKEN', t);\n  ui.alert('Token disimpan. Tidak perlu deploy semula.');\n}\n\nfunction lihatToken() {\n  const t = PropertiesService.getScriptProperties().getProperty('TOKEN');\n  SpreadsheetApp.getUi().alert(t ? 'Token semasa: ' + t : 'Belum ada token. Pilih \"Tetapkan token keselamatan\".');\n}\n\nfunction semakStruktur() {\n  const ss = SpreadsheetApp.getActive(), msg = [];\n  Object.keys(HELAIAN).concat(['Dashboard_Kuiz']).forEach(k => {\n    const n = HELAIAN[k] || k, sh = ss.getSheetByName(n);\n    msg.push(n + ': ' + (sh ? 'ADA' + (HELAIAN[k] ? ' (' + Math.max(0, sh.getLastRow() - 1) + ' baris data)' : '') : 'TIADA'));\n  });\n  SpreadsheetApp.getUi().alert(msg.join('\\n'));\n}\n\n/* ================= KUIZ: cipta tab data & dashboard ================= */\nfunction sediakanKuiz() {\n  sediakanDataKuiz_();\n  binaDashboardKuiz_();\n  SpreadsheetApp.getUi().alert('Siap. Tab \"Data_Kuiz\" dan \"Dashboard_Kuiz\" telah disediakan.\\n\\nSekarang deploy versi baharu: Deploy \u2192 Manage deployments \u2192 \u270f \u2192 Version: New version \u2192 Deploy.');\n}\n\nfunction sediakanDataKuiz_() {\n  const ss = SpreadsheetApp.getActive();\n  let sh = ss.getSheetByName(HELAIAN.kuiz);\n  if (!sh) sh = ss.insertSheet(HELAIAN.kuiz);\n  if (sh.getMaxColumns() < KUIZ_LAJUR.length) sh.insertColumnsAfter(sh.getMaxColumns(), KUIZ_LAJUR.length - sh.getMaxColumns());\n  sh.getRange(1, 1, 1, KUIZ_LAJUR.length).setValues([KUIZ_LAJUR])\n    .setFontWeight('bold').setFontColor('#FFFFFF').setBackground(WARNA);\n  sh.setFrozenRows(1);\n  sh.setColumnWidth(1, 220); sh.setColumnWidth(6, 200); sh.setColumnWidth(8, 200); sh.setColumnWidth(15, 160);\n  const nota = sh.getRange(1, 16); nota.setNote('S1\u2026S' + SOALAN.length + ': 1 = betul, 0 = salah');\n  return sh;\n}\n\nfunction binaDashboardKuiz_() {\n  const ss = SpreadsheetApp.getActive();\n  let d = ss.getSheetByName('Dashboard_Kuiz');\n  if (d) { d.getCharts().forEach(c => d.removeChart(c)); d.clear(); d.clearConditionalFormatRules(); }\n  else d = ss.insertSheet('Dashboard_Kuiz');\n  const K = 'Data_Kuiz!';\n  const TAPIS = 'IF($C$4=\"\",' + K + 'D2:D>0,' + K + 'D2:D=$C$4)';\n\n  d.getRange('A1').setValue('DASHBOARD KUIZ PENILAIAN KEFAHAMAN SCCP \u2014 HOSPITAL PUSRAWI').setFontSize(15).setFontWeight('bold').setFontColor(WARNA);\n  d.getRange('A2').setValue('Dikemas kini automatik setiap kali wargakerja menamatkan kuiz di portal. Markah lulus: 80%.').setFontColor('#555555');\n  d.getRange('A4').setValue('Tapis tahun (kosongkan = semua tahun):').setFontWeight('bold');\n  d.getRange('C4').setBackground('#FFF6D6').setBorder(true, true, true, true, false, false);\n  d.getRange('C5').setFormula('=IF(C4=\"\",\">0\",C4)').setFontColor('#BBBBBB');\n  d.getRange('D4').setValue('\u2190 taip tahun, cth. 2026').setFontColor('#777777');\n\n  // KPI\n  const kpiL = ['Bil. cubaan', 'Bil. staf', 'Purata markah', 'Kadar lulus', 'Bil. lulus', 'Bil. gagal'];\n  const kpiF = [\n    '=COUNTIFS(' + K + 'D:D,$C$5)',\n    '=IFERROR(COUNTUNIQUE(FILTER(' + K + 'F2:F&\" | \"&' + K + 'H2:H,' + TAPIS + ')),0)',\n    '=IFERROR(AVERAGEIFS(' + K + 'L:L,' + K + 'D:D,$C$5)/100,0)',\n    '=IFERROR(E8/A8,0)',\n    '=COUNTIFS(' + K + 'D:D,$C$5,' + K + 'M:M,\"Lulus\")',\n    '=COUNTIFS(' + K + 'D:D,$C$5,' + K + 'M:M,\"Gagal\")'];\n  d.getRange(7, 1, 1, 6).setValues([kpiL]).setFontWeight('bold').setFontColor('#FFFFFF').setBackground(WARNA).setHorizontalAlignment('center');\n  d.getRange(8, 1, 1, 6).setFormulas([kpiF]).setFontSize(16).setFontWeight('bold').setHorizontalAlignment('center').setBackground('#ECF6EF');\n  d.getRange('C8:D8').setNumberFormat('0.0%');\n\n  // Mengikut jabatan (A11:E46)\n  d.getRange('A10').setValue('KEPUTUSAN MENGIKUT JABATAN').setFontWeight('bold').setFontColor(WARNA);\n  d.getRange(11, 1, 1, 5).setValues([['Jabatan', 'Bil. cubaan', 'Bil. staf', 'Purata markah', 'Kadar lulus']])\n    .setFontWeight('bold').setFontColor('#FFFFFF').setBackground(WARNA);\n  d.getRange('A12').setFormula('=IFERROR(SORT(UNIQUE(FILTER(' + K + 'H2:H,' + K + 'H2:H<>\"\",' + TAPIS + '))),\"\")');\n  const jf = [];\n  for (let r = 12; r <= 46; r++) {\n    jf.push([\n      '=IF(A' + r + '=\"\",\"\",COUNTIFS(' + K + 'H:H,A' + r + ',' + K + 'D:D,$C$5))',\n      '=IF(A' + r + '=\"\",\"\",IFERROR(COUNTUNIQUE(FILTER(' + K + 'F2:F,' + K + 'H2:H=A' + r + ',' + TAPIS + ')),0))',\n      '=IF(A' + r + '=\"\",\"\",IFERROR(AVERAGEIFS(' + K + 'L:L,' + K + 'H:H,A' + r + ',' + K + 'D:D,$C$5)/100,0))',\n      '=IF(A' + r + '=\"\",\"\",IFERROR(COUNTIFS(' + K + 'H:H,A' + r + ',' + K + 'D:D,$C$5,' + K + 'M:M,\"Lulus\")/B' + r + ',0))']);\n  }\n  d.getRange(12, 2, jf.length, 4).setFormulas(jf);\n  d.getRange('D12:E46').setNumberFormat('0.0%');\n\n  // Analisis soalan (G11:K\u2026)\n  const n = SOALAN.length, akhirS = 11 + n;\n  d.getRange('G10').setValue('ANALISIS SOALAN \u2014 soalan dengan % salah tinggi perlu diberi penekanan semula dalam latihan').setFontWeight('bold').setFontColor(WARNA);\n  d.getRange(11, 7, 1, 5).setValues([['Bil', 'Soalan', 'Bil. jawab', 'Bil. salah', '% salah']])\n    .setFontWeight('bold').setFontColor('#FFFFFF').setBackground(WARNA);\n  const sq = SOALAN.map((q, i) => {\n    const col = kolum_(16 + i), r = 12 + i;\n    return ['S' + (i + 1), q,\n      '=COUNTIFS(' + K + 'D:D,$C$5,' + K + col + ':' + col + ',\"<>\")',\n      '=COUNTIFS(' + K + 'D:D,$C$5,' + K + col + ':' + col + ',0)',\n      '=IFERROR(J' + r + '/I' + r + ',0)'];\n  });\n  d.getRange(12, 7, n, 2).setValues(sq.map(x => [x[0], x[1]]));\n  d.getRange(12, 9, n, 3).setFormulas(sq.map(x => [x[2], x[3], x[4]]));\n  d.getRange(12, 11, n, 1).setNumberFormat('0%');\n  d.getRange(12, 8, n, 1).setWrap(true);\n  d.setConditionalFormatRules([SpreadsheetApp.newConditionalFormatRule()\n    .setGradientMinpointWithValue('#FFFFFF', SpreadsheetApp.InterpolationType.NUMBER, '0')\n    .setGradientMaxpointWithValue('#F2B8B0', SpreadsheetApp.InterpolationType.NUMBER, '0.6')\n    .setRanges([d.getRange(12, 11, n, 1)]).build()]);\n\n  // Trend bulanan\n  const tb = akhirS + 3;\n  d.getRange(tb - 1, 7).setValue('TREND BULANAN').setFontWeight('bold').setFontColor(WARNA);\n  d.getRange(tb, 7, 1, 4).setValues([['Bulan', 'Nama bulan', 'Bil. cubaan', 'Purata markah']])\n    .setFontWeight('bold').setFontColor('#FFFFFF').setBackground(WARNA);\n  const BLN = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];\n  d.getRange(tb + 1, 7, 12, 2).setValues(BLN.map((b, i) => [i + 1, b]));\n  d.getRange(tb + 1, 9, 12, 2).setFormulas(BLN.map((_, i) => {\n    const r = tb + 1 + i;\n    return ['=COUNTIFS(' + K + 'D:D,$C$5,' + K + 'E:E,G' + r + ')',\n      '=IFERROR(AVERAGEIFS(' + K + 'L:L,' + K + 'D:D,$C$5,' + K + 'E:E,G' + r + ')/100,\"\")'];\n  }));\n  d.getRange(tb + 1, 10, 12, 1).setNumberFormat('0.0%');\n\n  // Lebar & carta\n  d.setColumnWidth(1, 230); d.setColumnWidths(2, 4, 110); d.setColumnWidth(6, 30);\n  d.setColumnWidth(7, 50); d.setColumnWidth(8, 420); d.setColumnWidths(9, 3, 90);\n  d.setFrozenRows(8);\n  d.insertChart(d.newChart().setChartType(Charts.ChartType.BAR)\n    .addRange(d.getRange('A11:A46')).addRange(d.getRange('E11:E46'))\n    .setOption('title', 'Kadar lulus mengikut jabatan').setOption('legend', { position: 'none' })\n    .setOption('hAxis', { format: 'percent', viewWindow: { min: 0, max: 1 } })\n    .setOption('colors', [WARNA]).setNumHeaders(1).setPosition(48, 1, 0, 0).setOption('width', 620).setOption('height', 420).build());\n  d.insertChart(d.newChart().setChartType(Charts.ChartType.COLUMN)\n    .addRange(d.getRange(11, 7, n + 1, 1)).addRange(d.getRange(11, 11, n + 1, 1))\n    .setOption('title', '% salah mengikut soalan').setOption('legend', { position: 'none' })\n    .setOption('vAxis', { format: 'percent', viewWindow: { min: 0, max: 1 } })\n    .setOption('colors', ['#B4533C']).setNumHeaders(1).setPosition(48, 7, 0, 0).setOption('width', 620).setOption('height', 420).build());\n  return d;\n}\n\nfunction kolum_(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }\n\n/** Uji dari pelayar: buka URL Web App \u2014 mesti papar {\"ok\":true,...} */\nfunction doGet() {\n  return balas({ ok: true, mesej: 'Web App SCCP PUSRAWI aktif', versi: 2, helaian: SpreadsheetApp.getActive().getName() });\n}\n\n/** Terima data dari portal */\nfunction doPost(e) {\n  try {\n    const body = JSON.parse(e.postData.contents);\n    const token = PropertiesService.getScriptProperties().getProperty('TOKEN');\n    if (token && body.token !== token) return balas({ ok: false, error: 'Token tidak sah. Semak token dalam portal.' });\n    if (body.ping) return balas({ ok: true, mesej: 'Sambungan berjaya ke \"' + SpreadsheetApp.getActive().getName() + '\"' });\n\n    const nama = HELAIAN[body.type];\n    if (!nama) return balas({ ok: false, error: 'Jenis data tidak dikenali: ' + body.type });\n    let sh = SpreadsheetApp.getActive().getSheetByName(nama);\n    if (!sh && body.type === 'kuiz') { sh = sediakanDataKuiz_(); try { binaDashboardKuiz_(); } catch (x) { } }\n    if (!sh) return balas({ ok: false, error: 'Tab ' + nama + ' tidak dijumpai.' });\n    const w = LEBAR[body.type];\n    const rows = (body.rows || []).map(r => bersih(r, w));\n    if (!rows.length) return balas({ ok: false, error: 'Tiada data dihantar.' });\n\n    const kunci = LockService.getScriptLock();\n    kunci.waitLock(30000);\n    let diganti = 0;\n    try {\n      // Buang rekod lama dengan ID yang sama (hantar semula = kemas kini, bukan pendua)\n      const ids = new Set(rows.map(r => String(r[0])));\n      const akhir = sh.getLastRow();\n      if (akhir > 1) {\n        const data = sh.getRange(2, 1, akhir - 1, w).getValues();\n        const kekal = data.filter(r => !ids.has(String(r[0])));\n        diganti = data.length - kekal.length;\n        if (diganti > 0) {\n          sh.getRange(2, 1, akhir - 1, w).clearContent();\n          if (kekal.length) sh.getRange(2, 1, kekal.length, w).setValues(kekal);\n        }\n      }\n      sh.getRange(Math.max(sh.getLastRow(), 1) + 1, 1, rows.length, w).setValues(rows);\n    } finally {\n      kunci.releaseLock();\n    }\n    return balas({ ok: true, ditambah: rows.length, diganti: diganti, helaian: nama });\n  } catch (err) {\n    return balas({ ok: false, error: String(err) });\n  }\n}\n\nfunction bersih(r, w) {\n  const out = [];\n  for (let i = 0; i < w; i++) {\n    let v = r[i] === undefined || r[i] === null ? '' : r[i];\n    if (typeof v === 'string' && /^[=+\\-@]/.test(v)) v = \"'\" + v;   // elak suntikan formula\n    out.push(v);\n  }\n  return out;\n}\n\nfunction balas(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";

   ["Penilaian Nilai Teras","Isi borang (pilih Jabatan dari senarai) → tekan <b>Salin ringkasan</b>, <b>⬇ PDF</b> atau <b>⬇ Word</b>. Penilaian direkod automatik ke tab Data_Nilai."],
   ["Kuiz Penilaian Kefahaman SCCP","Peserta isi nama, no. staf dan jabatan → jawab semua soalan → keputusan (markah, %, Lulus/Gagal, soalan yang salah) direkod automatik ke tab Data_Kuiz sebaik skrin keputusan dipaparkan. Setiap cubaan = satu baris."],

  <section class="card stack"><div class="row" style="justify-content:space-between"><h3>Kod Apps Script (Code.gs)</h3><button class="btn sm" id="gsCopy">Salin kod</button></div>
   <pre id="gsCode" style="margin:0;max-height:340px;overflow:auto;background:var(--sunk);padding:12px;border-radius:8px;font-family:var(--f-mono);font-size:.76rem;line-height:1.5;white-space:pre">${esc(GSCODE)}</pre></section>

  <section class="grid g2">
    <div class="card stack"><h3>Lajur Data_Audit (16)</h3><p style="font-size:.86rem">${AC.map((c,i)=>`<span class="code" style="margin:0 4px 4px 0;display:inline-block;white-space:normal">${String.fromCharCode(65+i)} · ${c}</span>`).join("")}</p></div>
    <div class="card stack"><h3>Lajur Data_Nilai (53)</h3><p style="font-size:.86rem">${NCs.map(c=>`<span class="code" style="margin:0 4px 4px 0;display:inline-block;white-space:normal">${c}</span>`).join("")}</p></div>
    <div class="card stack"><h3>Lajur Data_Kuiz (${15+QUIZ.length})</h3><p style="font-size:.86rem">${["ID_Kuiz","Tarikh","Masa","Tahun","Bulan","Nama","No_Staf","Jabatan","Jawatan","Markah","Jumlah_Soalan","Peratus","Keputusan","Cubaan_Ke","Soalan_Salah","S1 … S"+QUIZ.length+" (1 betul / 0 salah)"].map(c=>`<span class="code" style="margin:0 4px 4px 0;display:inline-block;white-space:normal">${c}</span>`).join("")}</p></div>
  </section>`;
  const saveCfg=()=>{const c={url:$("#gsUrl").value.trim(),token:$("#gsTok").value.trim()};store.set("sccp-gs",c);return c};
  $("#gsSave").onclick=()=>{const c=saveCfg();$("#gsMsg").textContent=c.url&&!/\/exec$/.test(c.url)?"Disimpan — tetapi URL biasanya berakhir /exec.":"Tetapan disimpan.";toast("Tetapan disimpan")};
  $("#gsTest").onclick=async()=>{saveCfg();$("#gsMsg").textContent="Menguji…";try{const j=await gsSend({ping:true});$("#gsMsg").textContent=j.unverified?"Permintaan dihantar, tetapi jawapan tidak dapat dibaca. Buka URL dalam tab baharu untuk semak.":"✓ "+(j.mesej||"Sambungan berjaya")}catch(e){$("#gsMsg").textContent="✗ "+(e.message||e)}};
  $("#gsCopy").onclick=()=>{const t=GSCODE;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Kod disalin"),()=>{const r=document.createRange();r.selectNodeContents($("#gsCode"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Tekan Ctrl+C untuk salin")});else{const r=document.createRange();r.selectNodeContents($("#gsCode"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};
}

/* ================= THEME ================= */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$$("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===t))}
$$("[data-theme-set]").forEach(b=>b.onclick=()=>{store.set("sccp-theme",b.dataset.themeSet);applyTheme(b.dataset.themeSet)});
applyTheme(store.get("sccp-theme","light"));
const FS=[15,16,17,18,20];let fsi=store.get("sccp-fs",1);const applyFs=()=>{document.documentElement.style.setProperty("--fs",FS[fsi]+"px");document.body.style.fontSize=FS[fsi]+"px"};applyFs();
$$("[data-fs]").forEach(b=>b.onclick=()=>{fsi=Math.max(0,Math.min(FS.length-1,fsi+ +b.dataset.fs));store.set("sccp-fs",fsi);applyFs()});

/* ================= BOOT ================= */
buildNav();
$("#menuBtn").onclick=()=>setDrawer(true);$("#drClose").onclick=()=>{setDrawer(false);$("#menuBtn").focus()};$("#scrim").onclick=()=>setDrawer(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#drawer").hidden){setDrawer(false);$("#menuBtn").focus()}});
$("#dq").addEventListener("keydown",e=>{if(e.key==="Enter"){pendingQuery=e.target.value;store.set("sccp-lib",{doc:"",lvl:"",q:e.target.value});setDrawer(false);if(location.hash==="#pustaka")route();else location.hash="#pustaka"}});
const gq=$("#gq");gq.addEventListener("keydown",e=>{if(e.key==="Enter"){pendingQuery=gq.value;store.set("sccp-lib",{doc:"",lvl:"",q:gq.value});if(location.hash==="#pustaka")route();else location.hash="#pustaka"}});
/* paparan lalai: sentiasa Utama apabila dibuka tanpa pautan khusus */
route();
})();
