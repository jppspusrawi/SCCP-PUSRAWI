<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6B5A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCCP PUSRAWI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="SCCP PUSRAWI">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SCCP PUSRAWI One Stop Center</title>
<meta name="description" content="Panduan dalaman Shariah Critical Control Point (SCCP) Hospital Pakar PUSRAWI Kuala Lumpur untuk latihan, rujukan wargakerja dan audit dalaman.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Code+Pro:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: controlled-document portal — sticky masthead, left index rail (desktop) / scrolling tab strip (phone), single reading column per view. */
:root{
  --bg:#E9EEEC; --surface:#FFFFFF; --sunk:#F1F4F3; --ink:#1C2825; --muted:#475551; --line:#C9D3CF;
  --brand:#11604F; --brand-ink:#FFFFFF; --brand-soft:#DDEFE8;
  --gold:#7A5A12; --gold-soft:#FBF3E1;
  --k:#A3281D; --k-soft:#FBE9E6; --tk:#2F5577; --tk-soft:#E6EEF6;
  --ok:#1E6E44; --ok-soft:#E3F3E9; --warn:#8A5300; --warn-soft:#FCF0DC;
  --box-kr:#EDF3FA; --box-kr-b:#B9CFE6; --box-rk:#ECF6EF; --box-rk-b:#B7DCC3; --box-tp:#F2F4F3; --box-tp-b:#D3DBD8; --box-dl-b:#E6D2A3;
  --gAM:#11604F; --gPK:#2F5F9E; --gPP:#9A5B08; --gSK:#6D4A9C;
  --vP:#2E6DA4; --vU:#7A5AA6; --vS:#2E8B57; --vR:#C0628A; --vA:#C27C1A; --vW:#1E8C8C; --vI:#8A5A3C;
  --f-display:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"Source Code Pro",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-ar:"Amiri","Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
  --r:10px; --shadow:0 1px 2px rgba(20,40,34,.05),0 4px 14px rgba(20,40,34,.04);
}
/* Gelap — kontras tinggi yang selesa, tanpa putih/hitam mutlak */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101816; --surface:#1A2421; --sunk:#212C29; --ink:#E1E8E5; --muted:#A7B5B0; --line:#33433E;
  --brand:#7DD0B9; --brand-ink:#0B1F19; --brand-soft:#1E3A32;
  --gold:#E3BE6E; --gold-soft:#2E2717;
  --k:#F29A8F; --k-soft:#3A201D; --tk:#9DC0E0; --tk-soft:#1C2A38;
  --ok:#86D2A5; --ok-soft:#183126; --warn:#E8B464; --warn-soft:#352A16;
  --box-kr:#1A2633; --box-kr-b:#2E4760; --box-rk:#182B22; --box-rk-b:#2C4F3C; --box-tp:#212C29; --box-tp-b:#3A4945; --box-dl-b:#5A4A25;
  --gAM:#7DD0B9; --gPK:#8FB6EA; --gPP:#E8B464; --gSK:#C3A6EA;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101816; --surface:#1A2421; --sunk:#212C29; --ink:#E1E8E5; --muted:#A7B5B0; --line:#33433E;
  --brand:#7DD0B9; --brand-ink:#0B1F19; --brand-soft:#1E3A32;
  --gold:#E3BE6E; --gold-soft:#2E2717;
  --k:#F29A8F; --k-soft:#3A201D; --tk:#9DC0E0; --tk-soft:#1C2A38;
  --ok:#86D2A5; --ok-soft:#183126; --warn:#E8B464; --warn-soft:#352A16;
  --box-kr:#1A2633; --box-kr-b:#2E4760; --box-rk:#182B22; --box-rk-b:#2C4F3C; --box-tp:#212C29; --box-tp-b:#3A4945; --box-dl-b:#5A4A25;
  --gAM:#7DD0B9; --gPK:#8FB6EA; --gPP:#E8B464; --gSK:#C3A6EA;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs,16px);line-height:1.75;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3.6vw,2.15rem);font-weight:600;letter-spacing:-.005em}
h2{font-size:clamp(1.3rem,2.8vw,1.6rem);font-weight:600}
h3{font-size:1.15rem;font-weight:600}
h4{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-body);font-weight:600;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ar{letter-spacing:0;font-family:var(--f-ar);direction:rtl;text-align:right;font-size:1.45rem;line-height:2;color:var(--ink)}

/* Masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1400px;margin:0 auto}
.seal.logo{background:none;border-radius:9px;object-fit:contain}
.seal{width:40px;height:40px;flex:none;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-ar);font-size:1.35rem;line-height:1}
.mast-t{min-width:0;flex:1}
.mast-t b{font-family:var(--f-display);font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-t span{font-size:.78rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{flex:none;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;border:1.5px solid var(--gold);color:var(--gold);padding:3px 8px;border-radius:4px;text-transform:uppercase}
.gsearch{flex:0 1 320px;min-width:0;position:relative}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fsz{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.fsz button{border:none;background:none;padding:4px 10px;cursor:pointer;color:var(--muted);font-weight:600}
.backbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border:1px solid var(--brand);background:var(--surface);color:var(--ink);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;font-size:.92rem;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn b{color:var(--brand)}
.xbar.side{flex-direction:column;align-items:stretch;padding-top:0}.xbar.side .row>.btn{flex:1 1 0;justify-content:center}.xbar.side .xmsg{font-size:.8rem}
.xbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;padding-top:4px}
details.it.flash{outline:3px solid var(--gold);outline-offset:2px}
.theme{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.theme button{border:none;background:none;padding:5px 11px;font-size:.78rem;cursor:pointer;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.menubtn{display:none;flex:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--brand-soft);color:var(--brand);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(20,30,27,.35);z-index:60}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(86vw,340px);background:var(--surface);z-index:61;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:4px 0 24px rgba(0,0,0,.15)}
.dr-head{display:flex;justify-content:space-between;align-items:center}
.dr-head b{font-size:1.15rem}
.dr-nav{display:flex;flex-direction:column;gap:2px}
.dr-nav .grp{margin:10px 0 2px 10px}
.dr-nav a{display:block;text-decoration:none;color:var(--ink);padding:11px 12px;border-radius:8px;font-size:1rem}
.dr-nav a{display:flex!important;align-items:center}.dr-nav a .n{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.dr-nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.dr-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.dr-foot .fsz{display:inline-flex!important}
.tabs{display:none;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);padding:6px 12px;gap:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-size:.85rem;padding:6px 12px;border-radius:999px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}

/* Shell */
.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:0}
.rail{position:sticky;top:61px;align-self:start;height:calc(100vh - 61px);overflow:auto;padding:20px 12px 20px 16px;border-right:1px solid var(--line)}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail .grp{margin:14px 0 4px 10px}
.rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;font-size:.92rem}
.rail a:hover{background:var(--sunk)}
.rail a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.rail a .n{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.rail-foot{margin-top:24px;padding:12px 10px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--line)}
main{min-width:0;padding:28px clamp(16px,3vw,40px) 80px}
.view{display:flex;flex-direction:column;gap:28px;max-width:1060px}
.lede{max-width:68ch;color:var(--muted);font-size:1.02rem}

@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .menubtn{display:inline-flex}
  .seal{display:none}
  .stamp{display:none}
  html{scroll-padding-top:90px}
}
@media (max-width:620px){
  .gsearch{display:none}
  .fsz{display:none}
  .theme button{padding:5px 8px}
  .mast-t b{font-size:.98rem}
}

/* Generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.K{background:var(--k-soft);color:var(--k)}
.pill.TK{background:var(--tk-soft);color:var(--tk)}
.code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}
.pol{font-family:var(--f-mono);font-size:.72rem;color:var(--gold);border:1px solid var(--gold);padding:1px 6px;border-radius:4px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.reset{justify-content:center;color:var(--k);border-color:color-mix(in srgb,var(--k) 45%,var(--line))}
.btn.sm{padding:5px 10px;font-size:.82rem}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:100%}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.88rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;gap:22px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .ar{font-size:1.7rem;color:var(--gold);text-align:left;direction:rtl}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.k b{color:var(--k)} .stat.tk b{color:var(--tk)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .st{flex:1 1 150px;min-width:0;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative}
.flow .st .mono{font-size:.72rem;color:var(--gold)}
.flow .st b{display:block;font-family:var(--f-display);margin:2px 0 4px}
.flow .st p{font-size:.82rem;color:var(--muted)}
.flow .st.top{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.flow .st.top p,.flow .st.top .mono{color:var(--brand-ink);opacity:.85}
.go{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s}
.go:hover{border-color:var(--brand)}
.go b{font-family:var(--f-display);font-size:1.02rem}
.go span{font-size:.85rem;color:var(--muted)}
.go i{font-style:normal;font-family:var(--f-mono);font-size:.72rem;color:var(--brand)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:78px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:.8rem;cursor:pointer;background:none;border:none;padding:2px 0;text-align:left}
.bar-row:hover .bar-t{text-decoration:underline}
.bar-track{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.bar-track .bk{background:var(--k)} .bar-track .bt{background:var(--tk)}
.bar-row .mono{color:var(--muted)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Training */
.mod{display:grid;grid-template-columns:56px minmax(0,1fr);gap:18px;padding:24px 0;border-top:1px solid var(--line)}
.mod .no{font-family:var(--f-display);font-size:2.2rem;color:var(--gold);line-height:1}
.mod .body{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:560px){.mod{grid-template-columns:minmax(0,1fr);gap:8px}}
.tier{display:grid;grid-template-columns:130px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tier>div{padding:12px 14px;border-bottom:1px solid var(--line)}
.tier>div:nth-last-child(-n+2){border-bottom:none}
.tier .h{background:var(--sunk);font-weight:600;font-family:var(--f-display)}
.tier .h small{display:block;font-family:var(--f-ar);font-size:1.05rem;color:var(--gold);font-weight:400}
@media (max-width:520px){.tier{grid-template-columns:minmax(0,1fr)}.tier>div{border-bottom:1px solid var(--line)!important}}
.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.five .c{padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.five .c .ar{font-size:1.25rem;line-height:1.5;color:var(--gold);text-align:left}
.five .c b{font-family:var(--f-display)}
.five .c span{font-size:.82rem;color:var(--muted)}
.five .c a{font-size:.78rem;font-family:var(--f-mono)}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.qk .c{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qk .c .ar{font-size:1.2rem;line-height:1.7}
.qk .c b{font-size:.78rem;font-family:var(--f-mono);color:var(--gold)}
.qk .c p{font-size:.86rem}
.anat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.anat .c{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.anat .c b{display:block;font-size:.9rem}
.anat .c span{font-size:.83rem;color:var(--muted)}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.values .v{padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.values .v .L{font-family:var(--f-display);font-size:1.8rem;color:var(--brand);line-height:1}
.values .v b{display:block;font-size:.88rem;margin-top:4px}
.values .v span{font-size:.78rem;color:var(--muted)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.steps li b{display:block}
.steps li span{overflow-wrap:anywhere;font-size:.88rem;color:var(--muted)}

/* Library items */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:70px;z-index:5}
@media (max-width:960px){.filters{position:static}}
.filters .field{flex:1 1 200px}
.docgrp{display:flex;flex-direction:column;gap:8px}
.docgrp>header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;padding:6px 2px}
.docgrp>header h3{font-size:1.1rem}
.docgrp>header .meta{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.sub{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:8px 2px 0}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.it[open]{box-shadow:var(--shadow)}
details.it>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:start;padding:12px 14px}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary .t{font-weight:500;min-width:0}
details.it>summary .t small{display:block;color:var(--muted);font-size:.78rem;font-weight:400;margin-top:2px}
details.it>summary .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.it-body{padding:4px 16px 18px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:760px){.it-body{grid-template-columns:minmax(0,1fr)}}
.it-body .full{grid-column:1/-1}
.blk h5{margin:0 0 6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.blk ol,.blk ul{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.blk ol{list-style:lower-roman}
.blk p{font-size:.92rem}
.dalil{background:var(--gold-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.dalil .ar{font-size:1.5rem}
.dalil .mk{font-style:italic;font-size:.9rem}
.dalil .src{font-size:.8rem;color:var(--muted)}
.xref a{font-family:var(--f-mono);font-size:.8rem;margin-right:6px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
mark{background:var(--gold-soft);color:inherit;padding:0 2px;border-radius:2px}

/* Audit */
.aud-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1100px){.aud-shell{grid-template-columns:minmax(0,1fr)}}
.sumbox{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1100px){.sumbox{position:static}}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.88rem}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.arow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--line)}
.arow[data-s="P"]{border-left-color:var(--ok)}
.arow[data-s="X"]{border-left-color:var(--k)}
.arow[data-s="NA"]{border-left-color:var(--muted);opacity:.8}
.arow .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arow .hd .t{font-weight:600;flex:1 1 240px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.82rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="X"]{background:var(--k);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="NA"]{background:var(--muted);color:var(--bg)}
.arow ol{margin:0;padding-left:1.4em;list-style:lower-roman;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.rk{display:flex;flex-wrap:wrap;gap:6px}
.rk label{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;border:1px solid var(--line);padding:4px 9px;border-radius:6px;cursor:pointer;background:var(--bg)}
.rk input{accent-color:var(--brand)}
.arow textarea{width:100%;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:50}

/* Quick refs */
.pt-toc{display:flex;flex-wrap:wrap;gap:6px}
.pt-toc a{font-size:.82rem;text-decoration:none;border:1px solid var(--line);padding:5px 11px;border-radius:999px;background:var(--surface);color:var(--ink)}
.v-b{color:var(--k);font-weight:600} .v-t{color:var(--ok);font-weight:600} .v-n{color:var(--muted)}
.diff td{background:var(--warn-soft)}
.cards3s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.cards3s{grid-template-columns:minmax(0,1fr)}}
.cards3s .c{padding:16px;border-radius:var(--r);background:var(--brand);color:var(--brand-ink)}
.cards3s .c b{font-family:var(--f-display);font-size:1.5rem;display:block}
.cards3s .c span{font-size:.86rem;opacity:.9}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rank li i{font-style:normal;font-family:var(--f-mono);font-weight:600;color:var(--gold);width:18px}

/* Quiz */
.qz{max-width:720px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;margin-bottom:8px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--k);background:var(--k-soft)}
.opt:disabled{cursor:default}
.qprog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--brand)}

/* Glossary */
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.gl .c{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.gl .c b{font-family:var(--f-display)}
.gl .c .ar{font-size:1.15rem;line-height:1.4;display:inline;margin-left:8px;color:var(--gold)}
.gl .c p{font-size:.88rem;color:var(--muted);margin-top:4px}

/* Nilai teras */
.vtag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.vtag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--vc,var(--muted))}
.vkey{display:flex;flex-wrap:wrap;gap:6px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.grades{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grades div{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.82rem}
.grades b{font-family:var(--f-display);font-size:1.3rem;display:block;line-height:1.1}
.nrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px 12px;align-items:start;border-left:4px solid var(--vc,var(--line))}
.nrow .no{font-family:var(--f-mono);font-weight:600;color:var(--muted);font-size:.85rem;padding-top:2px}
.nrow .ay{display:block;margin-top:4px;font-style:italic;color:var(--muted);font-size:.86rem}
.nrow .ay::before{content:"“"} .nrow .ay::after{content:"”"}
@media (max-width:620px){.nrow{grid-template-columns:28px minmax(0,1fr)}.nrow .seg{grid-column:1/-1}}
.gseg button{min-width:40px;font-weight:600}
.gseg button[aria-pressed="true"][data-v="A"]{background:var(--ok);color:var(--surface)}
.gseg button[aria-pressed="true"][data-v="B"]{background:var(--brand);color:var(--brand-ink)}
.gseg button[aria-pressed="true"][data-v="C"]{background:var(--warn);color:var(--surface)}
.gseg button[aria-pressed="true"][data-v="F"]{background:var(--k);color:var(--surface)}
.vbars{display:flex;flex-direction:column;gap:7px}
.vbars .r{display:grid;grid-template-columns:118px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:.8rem}
.vbars .tr{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden}
.vbars .tr i{display:block;height:100%;border-radius:5px;background:var(--vc)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .h{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.84rem;background:var(--bg)}
.umq{font-weight:600;font-size:1rem}
.umguide{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:.86rem}
.umguide ul{margin:4px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}


/* Kotak berwarna untuk bacaan */
.blk{border-radius:10px;padding:12px 14px;border:1px solid var(--box-tp-b);background:var(--box-tp)}
.blk.kr{background:var(--box-kr);border-color:var(--box-kr-b)}
.blk.kr h5{color:var(--tk)}
.blk.rk{background:var(--box-rk);border-color:var(--box-rk-b)}
.blk.rk h5{color:var(--ok)}
.blk.xr{background:var(--surface);border-style:dashed}
.blk.nob{background:none;border:none;padding:0}
.dalil{border:1px solid var(--box-dl-b)}
details.it{border-left:5px solid var(--gc,var(--line))}
details.it[data-g="AM"]{--gc:var(--gAM)} details.it[data-g="PK"]{--gc:var(--gPK)} details.it[data-g="PP"]{--gc:var(--gPP)} details.it[data-g="SK"]{--gc:var(--gSK)}
.docgrp>header{border-left:5px solid var(--gc,var(--brand));padding:8px 12px;background:var(--surface);border-radius:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.docgrp[data-g="AM"]{--gc:var(--gAM)} .docgrp[data-g="PK"]{--gc:var(--gPK)} .docgrp[data-g="PP"]{--gc:var(--gPP)} .docgrp[data-g="SK"]{--gc:var(--gSK)}
.go{border-top:4px solid var(--gc,var(--brand))}
.go:nth-child(6n+1){--gc:var(--gAM)} .go:nth-child(6n+2){--gc:var(--gPK)} .go:nth-child(6n+3){--gc:var(--gPP)} .go:nth-child(6n+4){--gc:var(--gSK)} .go:nth-child(6n+5){--gc:var(--k)} .go:nth-child(6n+6){--gc:var(--gold)}
.arow ol{background:var(--box-kr);border:1px solid var(--box-kr-b);border-radius:8px;padding:8px 12px 8px 2.2em}
.umguide{border:1px solid var(--box-rk-b);background:var(--box-rk)}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:6px}
.mod+.mod{border-top:1px solid var(--line)}
p,li{max-width:78ch}

{c:"AM00-4.8",m0:"Hifz an-Nasl wa al-'Ird",t:"Rawatan Bersalin Dan Reproduktif",l:"K",k:["Prosedur reproduktif hanya melibatkan pasangan yang sah bagi memelihara ketulenan nasab."],r:["Rekod pengesahan status perkahwinan","Rekod prosedur"],u:"Jabatan Obstetrik & Ginekologi dan Wad Bersalin.",d:"Rujuk dalil AM00 [4.1.1]",x:"SCCP/AM/02 [3.5], [3.6]",j:["OG"]},
{c:"AM00-4.9",m0:"Hifz an-Nasl wa al-'Ird",t:"Pengendalian Gamet, Embrio Dan Tisu Reproduktif",l:"K",k:["Pelabelan, penyimpanan dan rantaian jagaan yang ketat.","Pelupusan mengikut prosedur yang diluluskan."],r:["Daftar penyimpanan spesimen","Borang pelupusan"],u:"Jabatan Obstetrik & Ginekologi.",d:"Rujuk dalil AM00 [4.1.1]",j:["OG","LAB"]},
{c:"AM00-4.10",m0:"Hifz an-Nasl wa al-'Ird",t:"Pengenalan Dan Penyerahan Bayi",l:"K",k:["Sistem pengenalan berganda ibu dan bayi dilaksanakan sebelum sebarang penyerahan."],r:["Rekod pengenalan bayi","Borang penyerahan bayi"],u:"Wad Bersalin dan Jabatan Obstetrik & Ginekologi.",d:"Rujuk dalil AM00 [4.1.1]",j:["OG","PED"]},
{c:"AM00-5.1",m0:"Hifz al-Mal",t:"Penetapan Dan Pemakluman Caj",l:"K",k:["Kadar caj dimaklumkan kepada pesakit sebelum perkhidmatan diberikan bagi menghapuskan unsur gharar."],r:["Senarai kadar caj","Rekod pemakluman kepada pesakit"],u:"Unit Pendaftaran dan Unit Bil.",d:"Surah al-Nisa': 29; Surah al-Baqarah: 275; Surah al-Nisa': 58; Surah al-An'am: 152",a:"لَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ إِلَّا أَن تَكُونَ تِجَارَةً عَن تَرَاضٍ مِّنكُمْ",m:"Janganlah kamu memakan harta sesama kamu dengan jalan yang batil, kecuali perniagaan atas kerelaan antara kamu. (al-Nisa': 29)",j:["REG","BIL"]},
{c:"AM00-5.2",m0:"Hifz al-Mal",t:"Penyediaan Bil Dan Kutipan Bayaran",l:"K",k:["Setiap butiran bil sepadan dengan perkhidmatan sebenar.","Kesilapan dibetulkan dan lebihan dipulangkan."],r:["Bil pesakit","Rekod pelarasan dan bayaran balik"],u:"Unit Bil.",d:"Rujuk dalil AM00 [5.1.1]",j:["BIL"]},
{c:"AM00-5.3",m0:"Hifz al-Mal",t:"Pengurusan Kredit Dan Tunggakan",l:"K",k:["Terma pembayaran bebas daripada unsur riba.","Tindakan pemungutan dilaksanakan secara adil dan tidak menzalimi."],r:["Perjanjian kredit","Rekod tindakan kutipan"],u:"Unit Kawalan Kredit.",d:"Rujuk dalil AM00 [5.1.1]",j:["CR"]},
{c:"AM00-5.4",m0:"Hifz al-Mal",t:"Perolehan Dan Pemilihan Pembekal",l:"K",k:["Penilaian dijalankan secara telus.","Konflik kepentingan diisytiharkan dan sebarang pemberian yang mempengaruhi ditolak."],r:["Rekod penilaian pembekal","Borang perisytiharan konflik kepentingan"],u:"Unit Perolehan dan Jabatan Kewangan.",d:"Rujuk dalil AM00 [5.1.1]",x:"SCCP/AM/07 [1.3]",j:["PUR","KEW"]},
{c:"AM00-5.5",m0:"Hifz al-Mal",t:"Pengurusan Stor Dan Bekalan",l:"TK",k:["Kawalan tarikh luput dan pusingan stok dilaksanakan bagi mengelak pembaziran harta."],r:["Rekod kawalan stok","Laporan barang luput"],u:"Unit Pengurusan Material.",d:"Rujuk dalil AM00 [5.1.1]",j:["UPM"]},
{c:"AM00-5.6",m0:"Hifz al-Mal",t:"Penyelenggaraan Dan Pelupusan Aset",l:"TK",k:["Aset dijaga secara berhemah serta dilupuskan mengikut prosedur yang diluluskan dan direkodkan."],r:["Daftar aset","Borang pelupusan aset"],u:"Jabatan Penyelenggaraan dan Unit Biomedik.",d:"Rujuk dalil AM00 [5.1.1]",j:["BIO"]},
{c:"AM00-5.7",m0:"Hifz al-Mal",t:"Pengurusan Harta Pesakit Dan Derma",l:"K",k:["Barang berharga pesakit direkod dan dipulangkan.","Dana derma diasingkan dan digunakan mengikut niat penderma."],r:["Borang simpanan barang berharga","Penyata dana derma"],u:"Jabatan Kejururawatan dan Jabatan Kewangan.",d:"Rujuk dalil AM00 [5.1.1]",x:"SCCP/PK/01 [1.2]; SCCP/AM/07 [2.4]",j:["NUR","KEW"]},
/* ============ AM01 ============ */
{c:"AM01-1.1",m0:"P · Al-Itqan",t:"Professionalism (Al-Itqan)",l:"TK",k:["Kebolehpercayaan tinggi, konsisten, jujur sesama pekerja, majikan dan pelanggan.","Hasil kerja mengikut piawaian kualiti dan skala yang ditetapkan.","Berketerampilan menarik, kemas dan menunjukkan imej Islam dalam premis hospital.","Sentiasa menepati masa.","Budaya menawarkan bantuan kepada semua — wargakerja, pelawat, pesakit.","Tatacara bercakap dengan tetamu: berdiri, tangan di hadapan (kanan atas kiri), memandang wajah, ekspresi sepadan.","Membaca Bismillahirrahmanirrahim apabila memulakan pekerjaan, rawatan atau prosedur.","Menyebut Alhamdulillah apabila selesai pekerjaan, rawatan atau prosedur."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja Hospital PUSRAWI tanpa mengira jawatan atau jabatan.",d:"HR al-Tabarani: 891; HR Muslim: 1955; Surah al-Taubah: 119; Surah al-An'am: 152; HR al-Bukhari: 6094, Muslim: 2607; Surah al-A'raf: 31; HR Abu Daud: 4031; HR al-Bukhari: 5886; Surah al-Ahzab: 33; Surah al-'Asr; Surah al-Ma'idah: 2; HR Ibnu Majah: 2417; HR Ibnu Majah: 3800",a:"إِنَّ اللَّهَ تَعَالَى يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ",m:"Sesungguhnya Allah mencintai seseorang yang apabila bekerja, dia mengerjakannya secara itqan. (HR al-Tabarani)",j:["ALL"]},
{c:"AM01-1.2",m0:"U · Al-Wahdah",t:"Unity (Al-Wahdah)",l:"TK",k:["Satu semangat berpasukan, fokus kerja berpasukan dan bekerja secara harmoni.","Menumpukan perhatian dan bersungguh-sungguh terhadap pekerjaan."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja yang bekerja dalam pasukan/jabatan.",d:"Surah al-Hujurat: 10; Surah Ali 'Imran: 103; Surah al-Ma'idah: 2; HR al-Bukhari: 6011, Muslim: 2586",a:"وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا",m:"Berpegang teguhlah kamu semuanya kepada tali Allah, dan janganlah berpecah-belah. (Ali 'Imran: 103)",j:["ALL"]},
{c:"AM01-1.3",m0:"S · Al-Falah",t:"Success (Al-Falah)",l:"TK",k:["Berusaha mencapai matlamat dan objektif pengurusan.","Melakukan pekerjaan dengan teliti agar tidak menimbulkan masalah kepada diri dan syarikat."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja dalam melaksanakan tugas harian.",d:"Surah al-'Ankabut: 69; Surah al-Mu'minun: 1; Surah al-Najm: 39–40; Surah al-Taubah: 100; HR al-Baihaqi (Syu'ab al-Iman); HR Muslim: 17",a:"قَدْ أَفْلَحَ الْمُؤْمِنُونَ",m:"Sesungguhnya berjayalah orang-orang yang beriman. (al-Mu'minun: 1)",j:["ALL"]},
{c:"AM01-1.4",m0:"R · Al-Ihtiram",t:"Respect (Al-Ihtiram)",l:"TK",k:["Penghargaan dan tindakan positif terhadap semua tanpa mengira bangsa dan agama.","Adil memberikan hak tanpa menzalimi mana-mana pihak.","Menjaga maruah pesakit dengan etika perawatan yang betul.","Budaya senyum, memberi salam/ucapan selamat dan berterima kasih.","Adab sebelum memasuki ruangan orang lain atau ruangan pesakit.","Berjabat tangan (sesama jantina/mahram) dan memperkenalkan diri."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja dalam interaksi dengan rakan sekerja, pelawat dan pesakit.",d:"Surah al-Isra': 70; HR al-Bukhari: 6031; HR al-Tirmizi: 1919; Surah al-Ma'idah: 8; HR Muslim: 2590, 2626; HR al-Bukhari: 3035, 12; HR al-Tirmizi: 1956, 1954; Surah al-Nisa': 86; Surah al-Nur: 27; HR Abu Daud: 5212; Surah al-Hujurat: 13",a:"وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ",m:"Dan sesungguhnya Kami telah memuliakan anak-anak Adam. (al-Isra': 70)",x:"Berjabat tangan dengan bukan mahram — SCCP/AM/05 [1.2]",j:["ALL"]},
{c:"AM01-1.5",m0:"A · Al-Mas'uliyyah",t:"Accountability (Al-Mas'uliyyah)",l:"TK",k:["Kesanggupan menerima tanggungjawab.","Bertanggungjawab atas setiap tindakan dan tidak menyalahkan orang lain.","Menjaga kerahsiaan pesakit.","Menjaga kerahsiaan pemberi maklumat (aduan/siasatan).","Respon segera pasukan ERT (petugas dilantik dan terlatih) apabila berlaku kecemasan."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)","Laporan Penilaian","Borang Pemberitahuan Maklumat (UAD 10)","Laporan Latihan Fire Drill Bersama Bomba"],u:"Semua wargakerja dalam melaksanakan tanggungjawab masing-masing.",d:"Surah al-Nisa': 58; Surah al-Anfal: 27; Surah Fatir: 18; Surah al-Muddaththir: 38; HR al-Bukhari: 893, Muslim: 1829; Surah al-Hujurat: 12",a:"كُلُّكُمْ رَاعٍ وَكُلُّكُمْ مَسْؤُولٌ عَنْ رَعِيَّتِهِ",m:"Kamu semua adalah pemimpin, dan kamu akan ditanya tentang apa yang kamu pimpin. (HR al-Bukhari: 893)",x:"SCCP/AM/00 [2.11], [2.6]; SCCP/AM/07 [2.4]",j:["ALL"]},
{c:"AM01-1.6",m0:"W · Al-Hikmah",t:"Wisdom (Al-Hikmah)",l:"TK",k:["Bijak mengurus ilmu untuk disesuaikan dengan tindakan.","Mampu mengurus diri dalam apa jua situasi dan menyampaikannya kepada orang lain.","Proaktif dan bijak mengambil inisiatif untuk kecemerlangan perkhidmatan.","Budaya mendoakan kesejahteraan pesakit ketika berinteraksi.","Meminta maaf jika perlu."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja dalam mengurus diri, ilmu dan interaksi dengan pesakit.",d:"Surah al-Baqarah: 269; Surah al-Nahl: 125; HR al-Bukhari: 2442, Muslim: 2580; HR Muslim: 2733, 919; Surah al-A'raf: 199",a:"وَمَن يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا",m:"Sesiapa yang diberikan hikmah, sesungguhnya dia telah diberi kebaikan yang banyak. (al-Baqarah: 269)",j:["ALL"]},
{c:"AM01-1.7",m0:"I · An-Nazahah",t:"Integrity (An-Nazahah)",l:"TK",k:["Jati diri: ikhlas, telus, berpegang kepada prinsip dan tidak mudah dipengaruhi.","Sentiasa benar dalam penyampaian maklumat."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja dalam penyampaian maklumat dan pematuhan amanah/janji.",d:"Surah al-Mu'minun: 8; Surah al-Baqarah: 42; HR Ahmad: 12383; HR al-Bukhari: 6094, Muslim: 2607",a:"وَلَا تَلْبِسُوا الْحَقَّ بِالْبَاطِلِ وَتَكْتُمُوا الْحَقَّ وَأَنتُمْ تَعْلَمُونَ",m:"Janganlah kamu campur-adukkan yang benar dengan yang salah, dan menyembunyikan kebenaran padahal kamu mengetahuinya. (al-Baqarah: 42)",j:["ALL"]},
/* ============ AM02 ============ */
{c:"AM02-1.1",m0:"Anggota Badan, Janin & Jenazah",t:"Pengurusan Anggota Badan Terpotong Dan Uri Yang Tidak Dituntut",l:"K",k:["Anggota badan terpotong diserahkan kepada tuannya atau waris.","Jika tidak dituntut, ditanam secara terhormat.","Rujuk Jabatan Agama Islam untuk tempat tanam.","Uri diserahkan kepada keluarga/waris bayi dengan nasihat menanam di tempat bersesuaian.","Jika tidak mampu, uri boleh dibuang bersama clinical waste dan tidaklah berdosa."],r:[],n:"Rekod penilaian belum ditetapkan — untuk pengesahan Jabatan Kualiti",u:"Dewan Bedah, Kawalan Infeksi, Wad Ar-Rahmah dan unit yang terlibat dalam proses kelahiran bayi.",d:"Surah al-Isra': 70; JK Perundingan Hukum Syarak WP (21 Feb 2019); Ibnu Qudamah, al-Syarh al-Kabir 1/104–105; Mughni al-Muhtaj 1/349",a:"وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ",m:"Dan sesungguhnya Kami telah memuliakan anak-anak Adam. (al-Isra': 70)",j:["OT","INF","OG"]},
{c:"AM02-1.2",m0:"Anggota Badan, Janin & Jenazah",t:"Pengurusan Janin Dan Kes Kematian Bayi",l:"K",k:["Pengurusan jenazah bayi/janin disegerakan oleh pihak yang ditetapkan.","Livebirth dimandikan, dikafan, disolatkan dan dikebumikan.","Stillbirth cukup sekadar dibasuh dan ditanam di tempat yang selamat (rujuk kategori a–d)."],r:["Borang Persetujuan Pengurusan Jenazah (ADM 01)"],u:"O&G, Annur dan Wad Bersalin.",d:"HR al-Bukhari: 3208, Muslim: 2643; al-Zuhaili, al-Mu'tamad 1/629–630; fatwa Imam al-Ramli (≥24 minggu)",j:["OG","MOR","PED"]},
{c:"AM02-1.3",m0:"Anggota Badan, Janin & Jenazah",t:"Pengurusan Jenazah Khunsa Musykil",l:"K",k:["Memastikan jenazah mempunyai waris lelaki atau perempuan untuk memandikan.","Jika tiada, harus bagi lelaki dan wanita memandikan kerana darurat, dan kekal hukum kanak-kanak."],r:[],n:"Rekod penilaian belum ditetapkan — untuk pengesahan Jabatan Kualiti",u:"Mortuari dan unit yang terlibat dalam pengurusan jenazah.",d:"al-Nawawi, Raudhah al-Talibin; Mughni al-Muhtaj; al-Kafi li al-Fatawi Siri 1899",a:"يَجُوزُ لِلرِّجَالِ وَالنِّسَاءِ جَمِيعًا غَسْلُهُ لِلضَّرُورَةِ",m:"Harus bagi lelaki dan wanita memandikannya kerana darurat. (Raudhah al-Talibin)",j:["MOR"]},
{c:"AM02-1.4",m0:"Anggota Badan, Janin & Jenazah",t:"Pengurusan Jenazah Transgender",l:"K",k:["Jenazah dikenal pasti status asal jantina dan diuruskan mengikut jantina asal."],r:[],n:"Rekod penilaian belum ditetapkan — untuk pengesahan Jabatan Kualiti",u:"Mortuari dan unit yang terlibat dalam pengurusan jenazah.",d:"HR al-Bukhari: 5886; Muzakarah JK Fatwa Kebangsaan Kali Ke-25 (13 Dis 1989)",j:["MOR"]},
{c:"AM02-1.5",m0:"Anggota Badan, Janin & Jenazah",t:"Pengurusan Jenazah Penyakit Berjangkit",l:"K",p:"PPJ/KWI/05",k:["Mematuhi hifz al-nafs — keselamatan petugas dan orang awam.","Jenazah diuruskan oleh petugas yang sama jantina.","Mengelakkan kemudaratan jangkitan melalui kepatuhan SOP pengendalian jenazah berjangkit.","Menjaga aib jenazah/pesakit."],r:["Borang Persetujuan Pengurusan Jenazah (ADM 01)"],u:"Jabatan Kawalan Infeksi — selaras Garis Panduan KKM dan Akta 342.",d:"Surah al-Isra': 70; HR Ibnu Majah: 2341; Muzakarah Kali Ke-29 (AIDS, 1992); Muzakarah Khas MKI (COVID-19, 15 Mac 2020)",a:"لَا ضَرَرَ وَلَا ضِرَارَ",m:"Tidak boleh memudaratkan diri sendiri dan orang lain. (HR Ibnu Majah: 2341)",j:["INF","MOR"]},
{c:"AM02-2.1",m0:"Ibadah Pesakit",t:"Garis Panduan Melakukan Prosedur Pada Bulan Puasa",l:"K",k:["Wargakerja mengetahui secara umum hukum berpuasa ketika mengambil ubat atau menjalani prosedur.","Pengambilan ubat melalui mulut membatalkan puasa.","Pengambilan ubat secara suntikan (bukan melalui mulut) tidak membatalkan puasa."],r:[],n:"Rekod penilaian belum ditetapkan — untuk pengesahan Jabatan Kualiti",u:"Semua unit klinikal yang merawat pesakit berpuasa, khususnya Radiologi.",d:"Surah al-Baqarah: 183, 185; Garis Panduan JAKIM (2013); Majma' al-Fiqh al-Islami",a:"يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ",m:"Allah menghendaki kemudahan bagi kamu dan tidak menghendaki kesukaran. (al-Baqarah: 185)",x:"Jadual 26 prosedur — lihat Rujukan Pantas",j:["RAD","KLIN","PHA"]},
{c:"AM02-2.2",m0:"Ibadah Pesakit",t:"Status Puasa Ibu Yang Hamil Atau Menyusukan Bayi",l:"TK",k:["Ibu hamil atau menyusu diwajibkan berpuasa seperti orang lain.","Dibenarkan berbuka jika bimbangkan keselamatan diri, diri dan anak, atau anak sahaja.","Nasihat doktor hendaklah diambil kira."],r:[],n:"Rekod penilaian belum ditetapkan — untuk pengesahan Jabatan Kualiti",u:"O&G dan unit yang merawat pesakit hamil atau menyusu.",d:"Surah al-Baqarah: 184",x:"Jadual Qadha & Fidyah — lihat Rujukan Pantas",j:["OG"]},
{c:"AM02-2.3",m0:"Ibadah Pesakit",t:"Hukum Darah Wanita",l:"TK",k:["Mengetahui hukum asas darah haid, nifas, istihadhah dan wiladah.","Mengikut garis panduan hukum-hakam Darah Wanita yang disediakan."],r:[],n:"Rekod penilaian belum ditetapkan — untuk pengesahan Jabatan Kualiti",u:"Semua unit yang merawat pesakit wanita, khususnya O&G dan Kejururawatan.",d:"Surah al-Baqarah: 222; Panduan Bersuci & Bersolat Bagi Pesakit (JAWI)",j:["OG","NUR"]},
{c:"AM02-3.1",m0:"Ubat & Prosedur",t:"Panduan Penggunaan Ubat Yang Mempunyai Unsur Tidak Halal",l:"K",k:["Mempunyai senarai ubatan yang mengandungi unsur haram atau meragukan.","Merujuk panduan fiqh medik bagi menentukan keadaan darurat atau tidak.","Sekiranya tiada alternatif, pesakit diberi penerangan yang jelas."],r:["Borang Keizinan Menggunakan Ubatan (PHAR 55)"],u:"Farmasi dan semua unit yang mempreskripsi atau mentadbir ubatan.",d:"Surah al-Baqarah: 168, 173; HR Abu Daud: 3874; HR al-Bukhari: 52, Muslim: 1599; HR al-Tirmizi: 2518; Muzakarah Kali Ke-7 (alkohol, 1984)",a:"فَتَدَاوَوْا وَلَا تَدَاوَوْا بِحَرَامٍ",m:"Maka berubatlah kamu, dan janganlah berubat dengan yang haram. (HR Abu Daud: 3874)",j:["PHA","PAK","KLIN"]},
{c:"AM02-3.2",m0:"Ubat & Prosedur",t:"Solat Pesakit Yang Menggunakan Gel Porcine (DUODERM)",l:"K",k:["Memberi penerangan berkenaan status solat pesakit yang menggunakan produk rawatan berunsur porcine."],r:["Nota Kemajuan (ADM 95)","Borang Keizinan Menggunakan Ubatan (PHAR 55)"],u:"Wad Surgikal (As-Salam).",d:"Surah al-Baqarah: 173; Surah al-Taghabun: 16; qiyas jabr al-'azm bi al-najis (al-Majmu')",n:"Huraian fiqh ditanda untuk semakan Pegawai Agama",j:["NUR"]},
{c:"AM02-3.3",m0:"Ubat & Prosedur",t:"Hukum Pemindahan Darah (Transfusi Darah/Komponen Darah)",l:"K",p:"PPJ/NUR/09",k:["Mengelakkan mudarat.","Penerangan yang jelas kepada pesakit dan waris.","Melaporkan sebarang alahan kepada makmal dengan segera."],r:["Borang Permohonan Transfusi (LAB 01)","Laboratory Request Form (LAB 02)","Senarai Semak Transfusi Darah (NUR 73)","Borang Persetujuan Pemindahan Darah (LAB 06)","Blood Transfusion Guideline"],u:"Jabatan Kejururawatan — transfusi darah/komponen darah.",d:"Surah al-Isra': 70; konsep istihalah; Muzakarah JK Fatwa Kebangsaan (kali/tarikh perlu dinyatakan)",n:"Rujukan Muzakarah perlu dilengkapkan",j:["NUR","LAB"]},
{c:"AM02-3.4",m0:"Ubat & Prosedur",t:"Hukum Berkhatan",l:"TK",p:"PPJ/NUR/07",k:["Pesakit dan waris diterangkan prosedur, komplikasi dan kos dengan jelas oleh pakar.","Menawarkan prosedur khatan kepada waris/penjaga bayi baru lahir."],r:["Consent form penjaga","Tawaran perkhidmatan secara verbal oleh pakar"],u:"Jabatan Kejururawatan (PPJ/NUR/07; PPJ/NUR/19).",d:"Surah al-Nahl: 123; HR al-Bukhari: 3356, Muslim: 2370; HR Muslim: 349; HR Abu Daud: 5271; Muzakarah Kali Ke-86 (2009)",j:["NUR","PED","PAK"]},

{c:"AM05-1.2",t:"Adab Pergaulan Berlainan Jantina",l:"K",p:"PPJ/BK/06",k:["Mematuhi adab pergaulan berlainan jantina dengan rakan sekerja dan pesakit."],r:["Jadual kerja jabatan yang memerlukan wargakerja wanita sahaja (Bilik Bersalin)"],u:"Semua wargakerja, termasuk jabatan yang menetapkan wargakerja wanita sahaja seperti Bilik Bersalin.",d:"Surah al-Nur: 30–31; kaedah Sadd al-Zara'i'",a:"قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ",m:"Katakanlah kepada lelaki beriman supaya menundukkan pandangan dan memelihara kehormatan mereka. (al-Nur: 30)",j:["ALL","OG"]},
{c:"AM05-1.3",t:"Peneman Ketika Mendapatkan Rawatan",l:"K",p:"PPJ/BK/06",k:["Rawatan di Bilik Rawatan Tertutup mesti ditemani peneman sama jantina dengan pesakit/perawat.","Perawat dan pesakit berlainan jantina yang melibatkan pembukaan aurat mengamalkan etika 3S: Sopan, Sekadar, Sama Jantina.","Jika tiada peneman, perawat perlu membuka pintu bilik rawatan."],r:["Senarai Semak Ziarah Pesakit (BK 01)","Jadual kerja jabatan"],u:"Semua unit klinikal dengan bilik rawatan tertutup atau prosedur membuka aurat.",d:"HR al-Bukhari: 5233, Muslim: 1341; Keputusan Majma' al-Fiqh al-Islami No. 81 (12/8), 1993",x:"SCCP/AM/06 [1.2]",j:["KLIN"]},
{c:"AM05-1.4",t:"Komunikasi Berkesan (Beradab, Penerangan Jelas, Profesional)",l:"TK",k:["Beradab, memberi penerangan jelas dan mudah difahami mengikut keadaan pesakit, profesional dalam apa jua situasi."],r:["Maklum Balas Pesakit (UPP 08)","Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja yang berkomunikasi dengan pesakit dan keluarga.",d:"HR al-Bukhari: 95; Surah al-Duha: 10",a:"وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ",m:"Adapun orang yang meminta, janganlah engkau tengking. (al-Duha: 10)",j:["ALL"]},
{c:"AM05-1.5",t:"Meminta Izin",l:"TK",k:["Meminta izin sebelum memasuki ruangan pesakit dan sebelum memberikan rawatan."],r:["Maklum Balas Pesakit (UPP 08)","Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja sebelum memasuki bilik pesakit dan memberi rawatan.",d:"Surah al-Nur: 27; HR al-Bukhari: 6241, Muslim: 2156",a:"إِنَّمَا جُعِلَ الِاسْتِئْذَانُ مِنْ أَجْلِ الْبَصَرِ",m:"Sesungguhnya meminta izin itu disyariatkan kerana menjaga pandangan. (HR al-Bukhari: 6241)",x:"SCCP/AM/06 [1.4]",j:["ALL"]},
/* ============ AM06 ============ */
{c:"AM06-1.1",t:"Penjagaan Aurat Pesakit Dan Petugas Semasa Pemeriksaan, Rawatan, Prosedur Dan Pemindahan",l:"K",k:["Pesakit: utamakan petugas sama jantina, sekurang-kurangnya ketika prosedur yang mendedahkan aurat.","Pesakit: minimumkan pendedahan aurat — sekadar keperluan perubatan.","Pesakit: ruang rawatan/persalinan tertutup dan kelengkapan (drape, legging, disposable panties, gaun).","Pesakit: pakaian menutup aurat sepanjang pemindahan antara unit dan ke Dewan Bedah.","Petugas: pakaian/uniform dan PPE menutup aurat, termasuk pengendali makanan."],r:["Buku Jadual Tugasan/Assignment","Rekod Linen (Baju Wad, Legging)","Rekod bekalan sterile drape / disposable panties","Susun atur ruang rawatan tertutup","Pakaian pesakit ke Dewan Bedah","Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)","Borang Pemeriksaan Harian Kesihatan Dan Kebersihan Diri (DIET 11)"],u:"Dewan Bedah, Wad Bersalin, Wad Surgikal (As-Salam), Makmal Kardiovaskular, Hemodialisis, Klinik Pesakit Luar, Radiologi, Fisioterapi, Kebersihan, Linen, Dietetik.",d:"HR Muslim: 338; Surah al-Nur: 30; kaedah al-hajah tanzil manzilat al-darurah; ma ubiha li al-darurah yuqaddar bi qadariha; Majma' No. 81 (12/8), 1993",a:"مَا أُبِيحَ لِلضَّرُورَةِ يُقَدَّرُ بِقَدَرِهَا",m:"Sesuatu yang diharuskan kerana darurat diukur mengikut kadar keperluannya sahaja.",j:["KLIN","LIN","CLN","DIET"]},
{c:"AM06-1.2",t:"Penentuan Peneman Pesakit (Chaperon) Mengikut Batasan Syarak",l:"K",k:["Utamakan suami atau mahram sebagai peneman.","Bilik berkongsi (cth. wad kanak-kanak): peneman hendaklah wanita.","Perawat berlainan jantina: chaperon sama jantina dengan pesakit hadir — tiada khalwah.","Tiada peneman/chaperon: pintu bilik rawatan dibiarkan terbuka.","Kawalan akses fizikal peneman diselaraskan bersama Unit Sekuriti."],r:["Borang Peneman Pesakit Dalam (ADM 115)","Kad Peneman","Initial Nursing Assessment (NUR 01-1)"],u:"Kejururawatan (kemasukan wad, Wad Bersalin), Pediatrik (Ar-Raihan), Unit Sekuriti.",d:"HR al-Bukhari: 5233, Muslim: 1341",a:"لَا يَخْلُوَنَّ رَجُلٌ بِامْرَأَةٍ إِلَّا وَمَعَهَا ذُو مَحْرَمٍ",m:"Janganlah seorang lelaki berduaan dengan wanita kecuali bersamanya mahram. (HR al-Bukhari: 5233)",j:["NUR","OG","PED","SEC"]},
{c:"AM06-1.3",t:"Kemasukan Pesakit Ke Hospital (Termasuk Kes Kecemasan)",l:"K",p:"PPH/MED/01",k:["Penempatan bilik/wad diasingkan mengikut jantina.","Kes kecemasan dimasukkan ke wad dengan segera tanpa berlengah.","Penjagaan aurat dan peneman sepanjang kemasukan dilaksanakan sebagaimana 1.1 dan 1.2."],r:["Borang Kemasukan Pesakit (ADM 12)","Sistem Maklumat Hospital (HIS) — rekod penempatan katil","Laporan Rondaan Nursing Supervisor","Borang Peneman Pesakit Dalam (ADM 115)"],u:"Jabatan Kejururawatan — semua unit kemasukan pesakit (wad biasa dan kecemasan).",d:"al-Ghazali, al-Mustasfa; Surah al-Ma'idah: 32; Bayan Linnas Siri 189",x:"SCCP/AM/00 [2.1]",j:["NUR","ED","REG"]},
{c:"AM06-1.4",t:"Persetujuan Termaklum (Informed Consent) Sebelum Prosedur",l:"K",k:["Pesakit dan waris mendapat penerangan jelas: prosedur, risiko, pilihan rawatan lain dan kos.","Kebenaran bertulis daripada pesakit sebelum prosedur.","Pesakit bawah umur atau tidak berkeupayaan: kebenaran ibu bapa/penjaga/wali."],r:["Consent For Surgery/Procedure (ADM 25)"],u:"Semua unit klinikal yang menjalankan prosedur invasif/pembedahan, termasuk UPE (endoskopi, PPJ/DCS/02).",d:"HR al-Bukhari: 4458, Muslim: 2213 (hadis al-Ladud); Keputusan Majma' No. 67 (5/7), 1992",a:"يُشْتَرَطُ إِذْنُ الْمَرِيضِ لِلْعِلَاجِ إِذَا كَانَ تَامَّ الْأَهْلِيَّةِ",m:"Disyaratkan keizinan pesakit bagi rawatan jika dia mempunyai keahlian sempurna; jika tidak, keizinan walinya. (Majma' No. 67)",x:"SCCP/AM/00 [2.2]; SCCP/AM/05 [1.5]",j:["KLIN","OT"]},
{c:"AM06-1.5",t:"Kerahsiaan Maklumat Dan Rekod Pesakit",l:"K",k:["Data dan dokumen pesakit disimpan selamat tanpa kebocoran maklumat.","Akses rekod terhad kepada wargakerja berkaitan sahaja (Akta 709; Akta 586)."],r:["Pengurusan Rekod Perubatan Pesakit","Borang PDPA"],u:"Semua unit klinikal dan sokongan klinikal yang mengendalikan/menyimpan rekod pesakit.",d:"HR Abu Daud: 4868, al-Tirmizi: 1959; HR Muslim: 2699",a:"مَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالْآخِرَةِ",m:"Sesiapa menutup aib seorang Muslim, Allah menutup aibnya di dunia dan akhirat. (HR Muslim: 2699)",x:"SCCP/AM/01 [1.5] kriteria iii",j:["KLIN","MR","REG"]},

{c:"AM07-1.1",m0:"Sumber Manusia & Tatakelakuan",t:"Peraturan Berpakaian Wargakerja",l:"K",p:"PPJ/JSM/17",k:["Sopan dan menutup aurat.","Profesionalisme (kemas dan menunjukkan imej Islam)."],r:["Borang Penilaian Prestasi (JSM 08-01/08-02/08-03)"],u:"Semua wargakerja Hospital PUSRAWI.",d:"Rujuk SCCP/AM/01 [1.1] kriteria iii",x:"SCCP/AM/01 [1.1]; SCCP/AM/06 [1.1] kriteria v",j:["ALL","JSM"]},
{c:"AM07-1.2",m0:"Sumber Manusia & Tatakelakuan",t:"Melaporkan Gangguan Seksual",l:"K",p:"PPJ/JSM/26",k:["Menjaga maslahah dan mengelakkan kemudaratan melalui pelaporan segera kepada pihak berautoriti."],r:["Borang Aduan Gangguan Seksual (JSM 05-01)"],u:"Jabatan Sumber Manusia dan semua wargakerja.",d:"Surah al-Nisa': 148; HR al-Bukhari: 6952",a:"انْصُرْ أَخَاكَ ظَالِمًا أَوْ مَظْلُومًا",m:"Bantulah saudaramu sama ada dia zalim atau dizalimi — iaitu menghalangnya daripada kezaliman. (HR al-Bukhari: 6952)",j:["JSM","ALL"]},
{c:"AM07-1.3",m0:"Sumber Manusia & Tatakelakuan",t:"Pemberian Dan Penerimaan Hadiah, Ganjaran Atau Tajaan",l:"K",p:"PPJ/JSM/32",k:["Terhindar daripada terlibat dengan rasuah."],r:["Pengakuan/Pengesahan Penerimaan Hadiah/Ganjaran/Tajaan (JSM 06-06)","Borang Penyataan Tajaan Kursus (JSM 06-07)"],u:"Semua wargakerja yang menerima atau memberi hadiah/ganjaran/tajaan.",d:"Surah al-Baqarah: 188; HR Abu Daud: 3580, al-Tirmizi: 1337; HR Ahmad: 23601",a:"هَدَايَا الْعُمَّالِ غُلُولٌ",m:"Hadiah-hadiah kepada pegawai (kerana jawatannya) adalah pengkhianatan. (HR Ahmad: 23601)",j:["ALL","JSM","PUR"]},
{c:"AM07-1.4",m0:"Sumber Manusia & Tatakelakuan",t:"Penyalahgunaan Dadah Dan Alkohol",l:"K",p:"PPJ/JSM/33",k:["Menghindari penyalahgunaan dadah dan alkohol dalam persekitaran hospital."],r:["Borang Kebenaran Ujian Pengesahan Dadah dan Alkohol (JSM 02-23)","Laporan ujian makmal"],u:"Jabatan Sumber Manusia dan semua wargakerja.",d:"Surah al-Ma'idah: 90; HR Muslim: 2003; Muzakarah Kali Ke-76 (2006); Surah al-Baqarah: 219",j:["JSM","ALL"]},
{c:"AM07-2.1",m0:"Tadbir Urus Syariah, Kualiti & Harta",t:"Isu Syariah Yang Timbul Dalam Jabatan Atau Unit",l:"TK",p:"PPJ/BK/05",k:["Isu syariah daripada mana-mana jabatan/unit dirujuk melalui saluran rasmi (Jabatan Perundangan Dan Perkhidmatan Syariah)."],r:["Borang Isu Syariah (BK 06)"],u:"Semua jabatan/unit yang berhadapan isu syariah dalam operasi harian.",d:"Surah al-Nahl: 43; HR Abu Daud: 336; Safwah al-Tafasir 2/118",a:"فَإِنَّمَا شِفَاءُ الْعِيِّ السُّؤَالُ",m:"Sesungguhnya ubat bagi kejahilan itu ialah bertanya. (HR Abu Daud: 336)",j:["ALL","LGL"]},
{c:"AM07-2.2",m0:"Tadbir Urus Syariah, Kualiti & Harta",t:"Pengurusan Dokumen Fizikal Yang Mengandungi Ayat Al-Quran",l:"K",p:"PPJ/QLT/01",k:["Penjagaan kesucian ayat al-Quran.","Menghormati dan memuliakan ayat al-Quran dalam pengurusan serta pelupusan dokumen."],r:["Buku Rekod Pelupusan Dokumen Yang Mengandungi Ayat Al-Quran","Borang Tindakan Pelupusan Dokumen Mengandungi Ayat Al-Quran (QLT 24)"],u:"Jabatan Kualiti dan semua jabatan/unit yang mempunyai dokumen berayat al-Quran.",d:"al-Nawawi, al-Tibyan; Surah al-Hajj: 32; Surah al-Taubah: 65; Surah al-Kahfi: 103–105; HR al-Bukhari: 4987; Akta 559 Sek. 8; Surah al-Hijr: 9",a:"وَمَن يُعَظِّمْ شَعَائِرَ اللَّهِ فَإِنَّهَا مِن تَقْوَى الْقُلُوبِ",m:"Sesiapa yang memuliakan syiar-syiar Allah, maka itu daripada ketakwaan hati. (al-Hajj: 32)",j:["QLT","ALL"]},
{c:"AM07-2.3",m0:"Tadbir Urus Syariah, Kualiti & Harta",t:"Keakuran Terhadap Proses (Audit Dalaman)",l:"TK",p:"PPJ/QLT/04",k:["Memastikan keakuran terhadap proses yang ditetapkan."],r:["Jadual Kekerapan Audit","Penemuan Audit","Nota Audit","General Reporting Form (QLT 03)"],u:"Jabatan Kualiti — pelaksanaan audit dalaman.",d:"Surah al-Nisa': 59; HR al-Bukhari: 3039 (arahan pemanah Uhud)",a:"أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنكُمْ",m:"Taatlah kepada Allah, Rasul dan Ulil-Amri dari kalangan kamu. (al-Nisa': 59)",j:["QLT"]},
{c:"AM07-2.4",m0:"Tadbir Urus Syariah, Kualiti & Harta",t:"Pemulangan Barang Pinjaman Dan Tuntutan Semula Barang Yang Dipinjam",l:"TK",k:["Memulangkan barang pinjaman mengikut tempoh dan syarat perjanjian.","Mengganti barang yang dipinjam sekiranya hilang atau rosak."],r:[],n:"Rekod penilaian belum ditetapkan — untuk pengesahan Jabatan Kualiti",u:"Semua unit/jabatan yang meminjam atau meminjamkan peralatan/barangan.",d:"Surah al-Ma'idah: 1; Surah al-Baqarah: 282; HR Abu Daud: 3565, al-Tirmizi: 1265",a:"الْعَارِيَةُ مُؤَدَّاةٌ",m:"Barang pinjaman itu wajib dipulangkan. (HR Abu Daud: 3565)",x:"SCCP/PK/01 [1.2]; SCCP/PP/18 [1.1]",j:["ALL"]},
{c:"AM07-3.1",m0:"Aktiviti, Program & Pengiklanan (GP/BK/01)",t:"Pemilihan Aktiviti",l:"K",k:["Digalakkan melibatkan Pegawai Agama bagi pematuhan Syariah.","Masa, tempat dan waktu bersesuaian; tidak melalaikan solat dan puasa.","Menjaga adab pergaulan; tiada unsur syirik atau menjejaskan akidah.","Bebas provokasi; tiada pertaruhan/perjudian (yuran penyertaan bukan hadiah); tidak membazir.","Acara sukan: aktiviti lelaki dan perempuan diasingkan; penyokong lelaki hanya untuk pasukan lelaki."],r:["Borang Rujukan Kepada Pegawai Agama (BK 04)","Kertas cadangan/kelulusan aktiviti atau program"],u:"Semua jabatan/unit yang merancang aktiviti, program, majlis, pertandingan atau sukan.",d:"Surah al-Munafiqun: 9; Surah al-Isra': 27; Surah al-Ma'idah: 90; GP/BK/01 [4.1.1, 4.1.2]",a:"لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَن ذِكْرِ اللَّهِ",m:"Janganlah harta dan anak-anak melalaikan kamu daripada mengingati Allah. (al-Munafiqun: 9)",j:["MAR","JSM","QLT","ALL"]},
{c:"AM07-3.2",m0:"Aktiviti, Program & Pengiklanan (GP/BK/01)",t:"Persembahan",l:"K",k:["Lirik patuh Syariah: syahadah disempurnakan; ayat al-Quran tidak dijadikan lirik (kecuali iqtibas); tiada unsur lucah, maksiat, pemujaan atau penghinaan agama.","Etika persembahan: menutup aurat, kemas dan sopan; tiada tarian menggoda; tiada persentuhan lelaki-perempuan bukan mahram."],r:["Senarai lagu/atur cara persembahan untuk kelulusan","Borang Rujukan Kepada Pegawai Agama (BK 04)"],u:"Semua jabatan/unit yang menganjurkan persembahan, hiburan atau muzik.",d:"GP/BK/01 [4.1.3]; Bayan Linnas Siri 197; Garis Panduan Hiburan Dalam Islam (Fatwa Selangor 2/2015)",j:["MAR","JSM"]},
{c:"AM07-3.3",m0:"Aktiviti, Program & Pengiklanan (GP/BK/01)",t:"Pemakaian Semasa Aktiviti Dan Program",l:"K",k:["Percampuran lelaki dan perempuan: menutup aurat, sopan, terkawal dan tidak membawa fitnah.","Etika am: menutup aurat, kemas, bersih, sopan; tidak mencolok mata.","Sukan — Lelaki: T-shirt dan seluar panjang/melepasi lutut. Perempuan: T-shirt labuh lengan panjang, seluar panjang, menutup rambut dan leher, longgar."],r:["Garis panduan/edaran pakaian program kepada peserta","Borang Rujukan Kepada Pegawai Agama (BK 04)"],u:"Semua jabatan/unit yang menganjurkan program bercampur atau acara sukan.",d:"Surah al-Ahzab: 59; GP/BK/01 [4.2, 4.3.1]",j:["MAR","JSM"]},
{c:"AM07-3.4",m0:"Aktiviti, Program & Pengiklanan (GP/BK/01)",t:"Pembelian, Tempahan Atau Jualan Pakaian Program",l:"TK",k:["Program yang memberi/menjual pakaian memenuhi etika berikut.","Lelaki: T-shirt berkolar/leher bulat; seluar panjang dan longgar.","Perempuan: T-shirt Muslimah lengan panjang, labuh menutup punggung; seluar panjang dan longgar."],r:["Spesifikasi/tempahan pakaian program","Borang Rujukan Kepada Pegawai Agama (BK 04) — jika ada kemusykilan"],u:"Semua jabatan/unit yang mengendalikan pembelian/tempahan/jualan pakaian program.",d:"Rujuk AM07 [3.3.1]; GP/BK/01 [4.3.2]",j:["MAR","JSM","PUR"]},
{c:"AM07-3.5",m0:"Aktiviti, Program & Pengiklanan (GP/BK/01)",t:"Etika Pengiklanan",l:"K",k:["Maklumat benar, sahih, tidak mengelirukan; tiada manipulasi atau penipuan.","Bebas daripada sebarang unsur paksaan.","Gambar individu sopan, menutup aurat dan tidak mencolok mata.","Menjaga hak cipta — hanya bahan yang dibenarkan."],r:["Bahan pengiklanan (poster/video) yang dikeluarkan","Borang Rujukan Kepada Pegawai Agama (BK 04) — jika ada kemusykilan"],u:"Semua jabatan/unit yang mengeluarkan bahan pengiklanan, termasuk Jabatan Pemasaran.",d:"HR Muslim: 101; GP/BK/01 [4.4]",a:"مَنْ غَشَّنَا فَلَيْسَ مِنَّا",m:"Sesiapa yang menipu kami, maka dia bukan daripada golongan kami. (HR Muslim: 101)",j:["MAR"]},
/* ============ PK01 ============ */
{c:"PK01-1.1",t:"Code Blue (CPR) Diaktifkan Kecuali Kepada Pesakit Yang Mensyaratkan DNR",l:"K",p:"PPH/MED/07",k:["Menyelamatkan nyawa.","Membacakan talqin kepada pesakit yang sedang nazak."],r:["Resuscitation Event Record (Baby/Child) (NUR 40)","Resuscitation Event Record (Adult) (NUR 41)"],u:"Jabatan Kejururawatan — pengaktifan Code Blue kecuali pesakit bersyarat DNR.",d:"Surah al-Ma'idah: 32; HR Muslim: 916; HR Abu Daud: 3116",a:"مَنْ كَانَ آخِرُ كَلَامِهِ لَا إِلَٰهَ إِلَّا اللَّهُ دَخَلَ الْجَنَّةَ",m:"Sesiapa yang akhir perkataannya La ilaha illallah, dia masuk syurga. (HR Abu Daud: 3116)",x:"SCCP/AM/02 [4.1]; SCCP/AM/01 [1.1], [1.5]; SCCP/AM/03 [4.2]",j:["NUR","ICU","ED"]},
{c:"PK01-1.2",t:"Pengurusan Harta Benda Pesakit",l:"K",p:"PPJ/NUR/05",k:["Amanah menjaga harta pesakit.","Barangan tidak dituntut diuruskan mengikut hukum luqatah."],r:["Rekod Penyimpanan Harta Benda Pesakit (NUR 110)","Almari sisi berkunci"],u:"Jabatan Kejururawatan — harta benda pesakit termasuk barangan tidak dituntut.",d:"Surah al-Nisa': 58",a:"إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا",m:"Sesungguhnya Allah menyuruh kamu menyampaikan amanah kepada yang berhak. (al-Nisa': 58)",x:"SCCP/AM/01 [1.1], [1.5], [1.7]; SCCP/PP/18 [1.1]; SCCP/AM/00 [5.7]",j:["NUR"]},
/* ============ PK02 ============ */

/* cross-reference parsing: "SCCP/AM/06 [1.1], [1.2]" -> links */
function xrefLinks(txt){
  if(!txt)return "";
  const out=[];const re=/SCCP\/(AM|PK|PP|SK)\/(\d{2})((?:\s*(?:,|dan|–|-)?\s*\[\d+\.\d+\])*)/g;let m;
  while((m=re.exec(txt))){const dc=m[1]+m[2];const nums=(m[3].match(/\d+\.\d+/g)||[]);
    if(nums.length){nums.forEach(n=>{const code=dc+"-"+n;if(IMAP[code])out.push(code)})}
  }
  const re2=/\b(AM|PK|PP|SK)(\d{2}) \[(\d+\.\d+)(?:\.\d+)?\]/g;while((m=re2.exec(txt))){const code=m[1]+m[2]+"-"+m[3];if(IMAP[code])out.push(code)}
  let html=esc(txt);
  const uniq=[...new Set(out)];
  if(uniq.length)html+='<div class="xref" style="margin-top:6px">'+uniq.map(c=>`<a href="#pustaka" data-open="${c}">${c} ↗</a>`).join("")+"</div>";
  return html;
}

function itemCard(it,q){
  const hl=s=>{s=esc(s);if(!q)return s;try{return s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")}catch(e){return s}};
  const d=DOCMAP[docOf(it.c)];
  return `<details class="it" id="it-${it.c}" data-c="${it.c}" data-g="${d.g}">
  <summary><span class="code">${it.c}</span><span class="t">${hl(it.t)}<small>${esc(d.no)} · ${esc(d.t)}${it.m0?" · "+esc(it.m0):""}</small></span><span class="r">${it.p?`<span class="pol">${esc(it.p)}</span>`:""}<span class="pill ${it.l}">${it.l}</span></span></summary>
  <div class="it-body">
    <div class="blk kr"><h5>Kriteria penilaian</h5><ol>${it.k.map(k=>`<li>${hl(k)}</li>`).join("")}</ol></div>
    <div class="blk rk"><h5>Rekod penilaian (bukti)</h5>${it.r.length?`<ol>${it.r.map(r=>`<li>${hl(r)}</li>`).join("")}</ol>`:`<p class="muted">—</p>`}${it.n?`<div class="note" style="margin-top:8px">${esc(it.n)}</div>`:""}</div>
    <div class="blk full"><h5>Terpakai untuk</h5><p>${hl(it.u)}</p></div>
    <div class="blk full nob"><div class="dalil">${it.a?`<p class="ar">${it.a}</p><p class="mk">${esc(it.m)}</p>`:""}<div class="src"><b>Dalil & sumber:</b> ${xrefLinks(it.d)}</div></div></div>
    ${it.x?`<div class="blk full xr"><h5>Rujukan silang</h5><p style="font-size:.9rem">${xrefLinks(it.x)}</p></div>`:""}
  </div></details>`;
}

    <div class="field" style="flex:0 0 auto"><label>Tahap</label><div class="row" role="group" aria-label="Tahap">${[["","Semua"],["K","Kritikal"],["TK","Tidak Kritikal"]].map(x=>`<button class="chip" data-lvl="${x[0]}" aria-pressed="${st.lvl===x[0]}">${x[1]}</button>`).join("")}</div></div>

  </div>
  <div id="lres" class="stack" style="gap:26px"></div>`;
  const draw=()=>{

    let its=ITEMS.filter(i=>(!st.doc||docOf(i.c)===st.doc)&&(!st.lvl||i.l===st.lvl));
    if(st.pre)its=its.filter(i=>i.c.split("-")[1].startsWith(st.pre));
    if(q)its=its.filter(i=>[i.c,i.t,i.p,i.u,i.d,i.m,i.x,i.m0,...i.k,...i.r].join(" ").toLowerCase().includes(q));
    $("#lcount").textContent=its.length+" isu";
    if(!its.length){$("#lres").innerHTML=`<div class="empty">Tiada isu sepadan. Cuba kata kunci lain atau kosongkan penapis.</div>`;return}
    const groups={};its.forEach(i=>{(groups[docOf(i.c)]=groups[docOf(i.c)]||[]).push(i)});
    $("#lres").innerHTML=Object.keys(groups).map(dc=>{const d=DOCMAP[dc];let last="";

    LAST_LIST={title:st.doc?DOCMAP[st.doc].no+" "+DOCMAP[st.doc].t:"Semua dokumen SCCP",sub:[st.lvl?"Tahap "+st.lvl:"",st.q?"Kata kunci: "+st.q:""].filter(Boolean).join(" · "),items:its};
    openPending(v);
  };
  st.pre=st.pre||"";
  $("#lq").oninput=e=>{st.q=e.target.value;st.pre="";draw()};
  $("#ld").onchange=e=>{st.doc=e.target.value;st.pre="";draw()};
  $$("[data-lvl]",v).forEach(b=>b.onclick=()=>{st.lvl=b.dataset.lvl;$$("[data-lvl]",v).forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});

  draw();
}

/* ================= FORMS INDEX ================= */
function vForms(v){
  const re=/\b(ADM|NUR|JSM|PHAR|BK|QLT|LAB|MR|KEW|SS|UPP|UAD|PUR|MAR|DIET|BIL)\s(\d{2,3}(?:-\d{1,2})?(?:\/\d{2}-\d{2})*)/g;
  const F={};
  ITEMS.forEach(i=>i.r.forEach(r=>{let m;re.lastIndex=0;while((m=re.exec(r))){const code=m[1]+" "+m[2];let name=r.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim();if(/^[A-Z]{2,4} \d/.test(name)||name===code)name=code;
    F[code]=F[code]||{name,items:new Set()};if(F[code].name===code&&name!==code)F[code].name=name;F[code].items.add(i.c)}}));
  const P={};ITEMS.forEach(i=>{if(i.p)i.p.split(/;\s*/).forEach(p=>{(P[p]=P[p]||new Set()).add(i.c)})});
  const fk=Object.keys(F).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const pk=Object.keys(P).sort();
  v.innerHTML=`<header class="stack"><span class="eyebrow">Indeks · ${fk.length} borang berkod · ${pk.length} polisi</span><h1>Indeks borang, rekod dan polisi</h1><p class="lede">Gunakan indeks ini semasa menyemak rekod: cari kod borang untuk melihat isu SCCP mana yang bergantung kepadanya.</p></header>
  <div class="filters"><div class="field"><label for="fq">Cari kod atau nama</label><input id="fq" type="search" placeholder="cth. PHAR, ADM 25, peneman"></div></div>
  <section class="stack"><h2>Borang & rekod berkod</h2><div class="tbl-wrap"><table><thead><tr><th>Kod</th><th>Nama borang / rekod</th><th>Isu SCCP berkaitan</th></tr></thead><tbody id="ftb"></tbody></table></div></section>
  <section class="stack"><h2>Kod polisi hospital</h2><div class="tbl-wrap"><table><thead><tr><th>Polisi</th><th>Isu SCCP berkaitan</th></tr></thead><tbody id="ptb"></tbody></table></div></section>`;
  const draw=()=>{const q=$("#fq").value.trim().toLowerCase();
    $("#ftb").innerHTML=fk.filter(k=>!q||(k+" "+F[k].name).toLowerCase().includes(q)).map(k=>`<tr><td><span class="code">${esc(k)}</span></td><td>${esc(F[k].name)}</td><td>${[...F[k].items].map(c=>`<a href="#pustaka" data-open="${c}" class="mono" style="font-size:.8rem;margin-right:8px;white-space:nowrap">${c}</a>`).join("")}</td></tr>`).join("")||`<tr><td colspan="3" class="muted">Tiada padanan.</td></tr>`;
    $("#ptb").innerHTML=pk.filter(k=>!q||(k+" "+[...P[k]].map(c=>IMAP[c].t).join(" ")).toLowerCase().includes(q)).map(k=>`<tr><td><span class="pol">${esc(k)}</span></td><td>${[...P[k]].map(c=>`<a href="#pustaka" data-open="${c}" style="display:block;font-size:.86rem"><span class="mono" style="font-size:.78rem">${c}</span> ${esc(IMAP[c].t)}</a>`).join("")}</td></tr>`).join("")||`<tr><td colspan="2" class="muted">Tiada padanan.</td></tr>`};
  $("#fq").oninput=draw;draw();
}

function quizRow(who,res){const z=n=>String(n).padStart(2,"0");const t=new Date(res.at);
  const d=t.getFullYear()+"-"+z(t.getMonth()+1)+"-"+z(t.getDate()),hm=z(t.getHours())+":"+z(t.getMinutes())+":"+z(t.getSeconds());
  const pct=Math.round(res.score/QUIZ.length*100);const salah=res.ans.map((v,i)=>v?null:"S"+(i+1)).filter(Boolean).join(", ");
  return [((who.staf||who.nama)+" "+d+" "+hm).trim(),d,hm,t.getFullYear(),t.getMonth()+1,who.nama,who.staf||"",who.jab,who.jaw||"",res.score,QUIZ.length,pct,pct>=80?"Lulus":"Gagal",res.n,salah||"-",...res.ans.map(v=>v?1:0)]}
async function quizSync(row){if(IN_CLAUDE())return;try{const j=await gsSend({type:"kuiz",rows:[row]});console.info("[SCCP Google Sheet] kuiz direkod ("+(j.helaian||"")+")")}
  catch(e){console.info("[SCCP Google Sheet] kuiz tidak dapat direkod: "+(e.message||e));const q=store.get("sccp-quiz-q",[]);q.push(row);store.set("sccp-quiz-q",q.slice(-50))}}
async function quizFlush(){if(IN_CLAUDE())return;const q=store.get("sccp-quiz-q",[]);if(!q.length)return;try{await gsSend({type:"kuiz",rows:q});store.set("sccp-quiz-q",[])}catch(e){}}
function vQuiz(v){
  let idx=0,score=0,answered=false,ans=[];

  const form=()=>{const w=store.get("sccp-quiz-who",{});const qz=$("#qz");
    qz.innerHTML=`<span class="eyebrow">Maklumat peserta</span><h3>Isi maklumat sebelum mula</h3>
    <p class="muted" style="font-size:.9rem">Keputusan kuiz direkod dalam rekod latihan SCCP hospital untuk tujuan pemantauan kefahaman dan perancangan latihan.</p>

    <div class="field"><label for="qzJ">Jabatan / unit *</label><input id="qzJ" list="qzJL" value="${esc(w.jab||"")}" placeholder="Pilih dari senarai"><datalist id="qzJL">${Object.values(DEPTS).sort().map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>
    <div class="field"><label for="qzW">Jawatan</label><input id="qzW" value="${esc(w.jaw||"")}" placeholder="cth. Jururawat U29"></div></div>
    <div class="row"><button class="btn pri" id="qzGo">Mula kuiz</button><span id="qzMsg" class="muted" style="font-size:.88rem"></span></div>`;
    $("#qzGo").onclick=()=>{const who={nama:$("#qzN").value.trim().replace(/\s+/g," "),staf:$("#qzS").value.trim().toUpperCase(),jab:$("#qzJ").value.trim(),jaw:$("#qzW").value.trim()};
      if(!who.nama||!who.jab){$("#qzMsg").textContent="Sila isi nama dan jabatan.";($("#qzN").value.trim()?$("#qzJ"):$("#qzN")).focus();return}
      store.set("sccp-quiz-who",who);idx=0;score=0;ans=[];draw()}};
  const draw=()=>{const qz=$("#qz");const who=store.get("sccp-quiz-who",{});
    if(idx>=QUIZ.length){const pct=Math.round(score/QUIZ.length*100);if(best==null||score>best)store.set("sccp-quiz-best",score);
      const key=(who.staf||who.nama)+"|"+who.jab,cnt=store.get("sccp-quiz-n",{});cnt[key]=(cnt[key]||0)+1;store.set("sccp-quiz-n",cnt);
      quizSync(quizRow(who,{at:Date.now(),score,ans,n:cnt[key]}));
      const wrong=ans.map((x,i)=>x?null:i).filter(x=>x!=null);
      qz.innerHTML=`<span class="eyebrow">Keputusan · ${esc(who.nama)} · ${esc(who.jab)}</span><div style="font-family:var(--f-display);font-size:3rem;line-height:1;color:${pct>=80?"var(--ok)":"var(--warn)"}">${score}/${QUIZ.length} <span style="font-size:1.4rem">(${pct}%)</span></div><p>${pct>=80?"Tahniah — anda LULUS. Teruskan rujukan harian melalui Pustaka SCCP.":"Belum mencapai 80%. Ulang kaji Modul Latihan dan cuba sekali lagi."}</p>
      ${wrong.length?`<div class="note"><b>Soalan yang perlu diulang kaji:</b><ol style="margin:.4em 0 0">${wrong.map(i=>`<li value="${i+1}">${esc(QUIZ[i].q)}${QUIZ[i].c?` <a href="#pustaka" data-open="${QUIZ[i].c}" class="mono" style="font-size:.8rem">${QUIZ[i].c} ↗</a>`:""}</li>`).join("")}</ol></div>`:""}

    const q=QUIZ[idx];answered=false;
    qz.innerHTML=`<div class="qprog"><i style="width:${idx/QUIZ.length*100}%"></i></div><span class="eyebrow">Soalan ${idx+1} daripada ${QUIZ.length} · ${esc(who.nama||"")}</span><h3>${esc(q.q)}</h3><div>${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="qx"></div>`;
    $$(".opt",qz).forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const i=+b.dataset.i;const ok=i===q.a;if(ok)score++;ans[idx]=ok;
      $$(".opt",qz).forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("right")});if(!ok)b.classList.add("wrong");
      $("#qx").innerHTML=`<div class="note" style="border-color:${ok?"var(--ok)":"var(--k)"};background:${ok?"var(--ok-soft)":"var(--k-soft)"}"><b>${ok?"Betul.":"Kurang tepat."}</b> ${esc(q.e)} ${q.c?`<a href="#pustaka" data-open="${q.c}" class="mono" style="font-size:.8rem">${q.c} ↗</a>`:""}</div><div class="row" style="margin-top:10px"><button class="btn pri" id="qn">${idx+1<QUIZ.length?"Soalan seterusnya":"Lihat keputusan"}</button></div>`;
      $("#qn").onclick=()=>{idx++;draw()}})};
  form();quizFlush();
}
